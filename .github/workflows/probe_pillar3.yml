name: Probe III pillar sources

# Vienkartinė III pakopos fondų šaltinių patikra. Nieko neįrašo į data/ ir nekeičia svetainės.
on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Tiekėjai (tarpais), tuščia = visi: seb swedbank artea goindex luminor"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOINDEX_API_SECRET_KEY: ${{ secrets.GOINDEX_API_SECRET_KEY }}
      LUMINOR_PROXY_SERVER: ${{ secrets.LUMINOR_PROXY_SERVER }}
      LUMINOR_PROXY_USERNAME: ${{ secrets.LUMINOR_PROXY_USERNAME }}
      LUMINOR_PROXY_PASSWORD: ${{ secrets.LUMINOR_PROXY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Probe
        env:
          PROVIDERS: ${{ inputs.providers }}
        run: python -u tools/probe_pillar3.py $PROVIDERS
      # Rezultatai įrašomi į atskirą šaką „probe-results“ (ne main), kad juos būtų galima perskaityti.
      - name: Save results to probe-results branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r probe_out/. /tmp/out/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rfq . >/dev/null
          rm -rf probe_out
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "probe results $(date -u +%FT%TZ)"
          git push -f origin probe-results
