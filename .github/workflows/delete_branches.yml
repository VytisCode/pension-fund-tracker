# Vienkartinis: ištrina visas šakas, išskyrus main (savininko sprendimas 2026-10-14).
# Paleidžia savininkas: Actions → Delete old branches → Run workflow. Po to failą galima ištrinti.
name: Delete old branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while read -r b; do
            if [ "$b" != "main" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && echo "Ištrinta: $b"
            fi
          done
