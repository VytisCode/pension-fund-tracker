name: Backfill Allianz history

# Paleidžiama ranka: Actions → "Backfill Allianz history" → Run workflow
# Trunka maždaug 15–40 min (apie 2000 užklausų, po vieną kas ~0,3 s).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Allianz history
        run: python -u backfill_allianz.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nav_history.csv
          if git diff --cached --quiet; then
            echo "Nėra pakeitimų."
          else
            git commit -m "data: backfill Allianz history"
            git pull --rebase origin main
            git push
          fi
