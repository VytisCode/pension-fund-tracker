name: Fetch design images

# Naujo dizaino šalių nuotraukos iš Unsplash (tools/fetch_images.py). Paleidžiama ranka; esamų failų neperrašo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/fetch_images.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch
        run: |
          pip install -q pillow
          python -u tools/fetch_images.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/img/ctry-*.jpg site/img/CREDITS.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "img: naujo dizaino šalių nuotraukos"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i*10)); done
          exit 1
