name: Update fund data

# Darbo dienomis du kartus per valandą (:07 ir :37) nuo ~14:07 iki ~19:37 Vilniaus laiku vasarą
# (žiemą, UTC+2, viena valanda anksčiau: ~13:07–18:37). Minutės ne apvalios, nes GitHub
# per pilnas valandas dažniausiai vėlina arba praleidžia suplanuotus paleidimus.
# Be to ryte (~07:37 vasarą, antradienį–šeštadienį) papildomas paleidimas praėjusios dienos spragoms užpildyti.
# Kiekvienas tiekėjas tikrinamas tik jei saugykloje dar nėra laukiamos dienos duomenų,
# todėl kai viskas jau atnaujinta, paleidimas baigiasi per kelias sekundes.
# Ranka: Actions → "Update fund data" → Run workflow ok2
on:
  schedule:
    - cron: "7,37 11-16 * * 1-5"
    - cron: "37 4 * * 2-6"
  workflow_dispatch:
    inputs:
      send_report:
        description: "Išsiųsti dienos ataskaitą el. paštu dabar"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: update-fund-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOINDEX_API_SECRET_KEY: ${{ secrets.GOINDEX_API_SECRET_KEY }}
      LUMINOR_PROXY_SERVER: ${{ secrets.LUMINOR_PROXY_SERVER }}
      LUMINOR_PROXY_USERNAME: ${{ secrets.LUMINOR_PROXY_USERNAME }}
      LUMINOR_PROXY_PASSWORD: ${{ secrets.LUMINOR_PROXY_PASSWORD }}
      LUMINOR_BROWSER_RETRIES: "6"
      CATCHUP: ${{ github.event.schedule == '37 4 * * 2-6' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Light providers (Artea, Allianz, Goindex API)
        run: python -u update.py light

      - name: III pillar light providers (Artea API, Goindex API)
        if: always()
        run: python -u pillar3.py light

      - name: Does anything need a browser?
        id: need
        run: |
          python update.py needs-browser
          python pillar3.py needs-browser

      - name: Install browser
        if: steps.need.outputs.needs_browser == 'true' || steps.need.outputs.needs_browser_p3 == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Browser providers (SEB, Swedbank, Luminor)
        if: steps.need.outputs.needs_browser == 'true'
        run: python -u update.py browser

      - name: III pillar browser providers (SEB, Swedbank, Luminor)
        if: always() && steps.need.outputs.needs_browser_p3 == 'true'
        run: python -u pillar3.py browser

      - name: Build website (only if data changed)
        if: always()
        run: |
          if git diff --quiet -- data/nav_history.csv data/pillar3_history.csv; then
            echo "Duomenys nepasikeitė – svetainės nekeičiame."
          else
            python build_site.py
          fi

      # Viena kasdienė ataskaita el. paštu: pirmame paleidime po 16:00 UTC (~19:00 Vilniaus laiku vasarą)
      # arba paleidus ranka su „send_report“. Jei Gmail nustatymų (Secrets) dar nėra – ataskaita
      # vieną kartą per dieną paskelbiama kaip „Issue“ komentaras.
      - name: Daily report (e-mail)
        id: report
        if: always() && ((github.event_name == 'schedule' && github.event.schedule != '37 4 * * 2-6') || inputs.send_report)
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_REPORT: ${{ inputs.send_report && 'true' || 'false' }}
        run: |
          if [ "$FORCE_REPORT" != "true" ] && [ "$(date -u +%-H)" -lt 16 ]; then
            echo "Dar ne vakaras – ataskaitą siųsime vėlesniame paleidime."
            exit 0
          fi
          [ "$FORCE_REPORT" = "true" ] && rm -f data/report_state.json
          python daily_report.py send

      - name: Daily report fallback (GitHub issue comment)
        if: always() && steps.report.outputs.fallback == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Duomenų surinkimo ataskaitos in:title" --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            gh issue create --title "Duomenų surinkimo ataskaitos (testavimas)" --body-file report.md
          else
            gh issue comment "$NUM" --body-file report.md
          fi
          rm -f report.md

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nav_history.csv data/pillar3_history.csv data/update_state.json data/report_state.json data/last_update_log.txt docs
          # paskutinė gauta €STR norma: jei kitą kartą ECB nepasieks, svetainė naudos ją, o ne 2 %
          if [ -f data/risk_free.json ]; then git add data/risk_free.json; fi
          if git diff --cached --quiet; then
            echo "Nėra pakeitimų."
          else
            git commit -m "data: update $(TZ=Europe/Vilnius date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi

      # GitHub tvarkaraštis dažnai praleidžia paleidimus, todėl kiekvienas paleidimas, jei dar trūksta
      # duomenų ir dar ne vėlu (13:00–19:30 Vilniaus laiku), po 30 min. pats paleidžia kitą bandymą.
      # Taip pakanka, kad per dieną suveiktų bent vienas paleidimas (tvarkaraščio, ranka ar Claude ciklo).
      - name: Schedule next attempt (if data still missing)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(TZ=Europe/Vilnius date +%H%M)
          if [ "$NOW" -lt 1300 ] || [ "$NOW" -ge 1930 ]; then
            echo "Ne rinkimo laikas ($NOW) – kito bandymo neplanuojame."; exit 0
          fi
          if ! python update.py status 2>/dev/null | grep -q "trūksta"; then
            echo "Visi II pakopos duomenys surinkti – kito bandymo nereikia."; exit 0
          fi
          echo "Dar trūksta duomenų – kitas bandymas po 30 min."
          sleep 1800
          gh workflow run update.yml --ref main
