name: Update fund data

# Darbo dienomis du kartus per valandą (:07 ir :37) nuo ~14:07 iki ~19:37 Vilniaus laiku vasarą
# (žiemą, UTC+2, viena valanda anksčiau: ~13:07–18:37). Minutės ne apvalios, nes GitHub
# per pilnas valandas dažniausiai vėlina arba praleidžia suplanuotus paleidimus.
# Ryte (~07:37 vasarą, pirmadienį–šeštadienį) papildomas paleidimas praėjusios darbo dienos spragoms užpildyti.
# Kiekvienas tiekėjas tikrinamas tik jei saugykloje dar nėra laukiamos dienos duomenų,
# todėl kai viskas jau atnaujinta, paleidimas baigiasi per kelias sekundes.
# GitHub tvarkaraštis nepatikimas, todėl darbą papildomai paleidžia išorinis Cloudflare „žadintuvas“
# (infra/trigger-worker) per workflow_dispatch. Tokie paleidimai neišmetami.
# Ranka: Actions → "Update fund data" → Run workflow
on:
  schedule:
    - cron: "7,37 11-16 * * 1-5"
    - cron: "37 4 * * 1-6"
  workflow_dispatch:
    inputs:
      send_report:
        description: "Išsiųsti dienos ataskaitą el. paštu dabar"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: update-fund-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOINDEX_API_SECRET_KEY: ${{ secrets.GOINDEX_API_SECRET_KEY }}
      LUMINOR_PROXY_SERVER: ${{ secrets.LUMINOR_PROXY_SERVER }}
      LUMINOR_PROXY_USERNAME: ${{ secrets.LUMINOR_PROXY_USERNAME }}
      LUMINOR_PROXY_PASSWORD: ${{ secrets.LUMINOR_PROXY_PASSWORD }}
      LUMINOR_BROWSER_RETRIES: "6"
      CATCHUP: ${{ github.event.schedule == '37 4 * * 1-6' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Light providers (Artea, Allianz, Goindex API)
        run: python -u update.py light

      - name: III pillar light providers (Artea API, Goindex API)
        if: always()
        run: python -u pillar3.py light

      - name: Does anything need a browser?
        id: need
        run: |
          python update.py needs-browser
          python pillar3.py needs-browser

      - name: Install browser
        if: steps.need.outputs.needs_browser == 'true' || steps.need.outputs.needs_browser_p3 == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Luminor proxy (Proxy-Cheap) patikra – svetainė praneš, jei prieiga nebeveikia (pvz. baigėsi prenumerata)
      - name: Luminor proxy check
        if: steps.need.outputs.needs_browser == 'true' || steps.need.outputs.needs_browser_p3 == 'true'
        continue-on-error: true
        run: python -u tools/check_proxy.py

      - name: Browser providers (SEB, Swedbank, Luminor)
        if: steps.need.outputs.needs_browser == 'true'
        run: python -u update.py browser

      - name: III pillar browser providers (SEB, Swedbank, Luminor)
        if: always() && steps.need.outputs.needs_browser_p3 == 'true'
        run: python -u pillar3.py browser

      # Vertybinių popierių pavadinimai pagal ISIN (OpenFIGI, nemokamai): klausiama tik apie naujus ISIN
      # iš data/portfolios.csv, todėl dažniausiai trunka kelias sekundes.
      - name: Security names by ISIN (only new ones)
        if: always()
        continue-on-error: true
        run: python -u tools/fetch_isin_names.py

      # Obligacijų sąlygos (kuponas, išpirkimo data) ir pilni pavadinimai iš ES registro ESMA FIRDS (nemokamai):
      # klausiama tik apie naujus ISIN, iš jų svetainė skaičiuoja obligacijų YTM ir trukmę.
      - name: Bond terms by ISIN (only new ones)
        if: always()
        continue-on-error: true
        run: python -u tools/fetch_security_terms.py

      # Pasaulio akcijų indeksai palyginimui (MSCI World, MSCI ACWI, S&P 500 eurais; nemokami viešai skelbiami duomenys).
      - name: World equity indexes (MSCI, S&P 500)
        if: always()
        continue-on-error: true
        run: python -u indexes.py update

      # Vartotojų kainų indeksas (VKI, 2025 = 100) iš Valstybės duomenų agentūros – tik kai paskelbtas naujas mėnuo.
      - name: Consumer price index (State Data Agency)
        if: always()
        continue-on-error: true
        run: python -u tools/fetch_cpi.py

      # Vidutinė senatvės pensija (ketvirtiniai duomenys) iš Valstybės duomenų agentūros.
      - name: Average old-age pension (State Data Agency)
        if: always()
        continue-on-error: true
        run: python -u tools/fetch_pension.py

      # Vidutinis darbo užmokestis (Valstybės duomenų agentūra) – tik nauji metai.
      - name: Average wage (State Data Agency)
        if: always()
        continue-on-error: true
        run: python -u tools/fetch_wages.py

      # Nauji Lietuvos banko failai (portfeliai, II pakopos rezultatai, mokesčiai) – kartą per dieną, tik naujesni už turimus.
      - name: Bank of Lithuania files (portfolios, results, fees)
        if: always()
        continue-on-error: true
        run: python -u tools/fetch_lb.py

      # Latvijos (manapensija.lv) ir Estijos (pensionikeskus.ee) pensijų fondai – „Baltijos šalys“ puslapiui; tik papildo istoriją.
      - name: Baltic pension funds (Latvia, Estonia)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: python -u tools/fetch_baltic.py

      # Latvijos II pakopos plānų ketvirčio ataskaitos (manapensija.lv PDF): turtas, 10 didžiausių investicijų -> data/lv_*.csv (tik papildoma).
      # Kasdien patikrinami nauji ketvirčiai ir apdorojama dalis senesnės istorijos (biudžetas), kol ji užsipildo.
      - name: Latvian plan quarterly reports
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          command -v pdftotext >/dev/null || sudo apt-get install -y -q poppler-utils >/dev/null
          python -u tools/fetch_lv_reports.py --budget 150 --minutes 6
          python -u tools/fetch_lv_lb.py || echo "Latvijas Banka lentelė nepasiekiama"

      # Naujienos apie pensijas (LT, LV, EE): Google News ir leidinių RSS -> data/news.csv (tik papildoma)
      - name: Pension news
        if: always()
        continue-on-error: true
        timeout-minutes: 7
        run: python -u tools/fetch_news.py

      # Ką svarsto Seimas: posėdžių darbotvarkių pensijų klausimai (atviri LRS duomenys) -> data/seimas.csv (tik papildoma)
      - name: Seimas agenda
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: python -u tools/fetch_seimas.py

      - name: Build website (only if data changed)
        if: always()
        run: |
          if git diff --quiet -- data/nav_history.csv data/pillar3_history.csv data/indexes.csv imports/journey/cpi.csv imports/journey/pensions.csv imports/journey/wages.csv data/fees.csv data/portfolios.csv data/lb_results_history.csv data/baltic_ee.csv data/baltic_lv_index.csv data/baltic_lv_plans.csv data/lv_reports.csv data/lv_holdings.csv data/lv_files.csv data/baltic_lv_lb.csv data/news.csv data/seimas.csv \
             && [ -z "$(git status --porcelain -- imports/lb_results imports/lb_portfolios imports/lb_fees)" ]; then
            echo "Duomenys nepasikeitė – svetainės nekeičiame."
          else
            python -c "import openpyxl" 2>/dev/null || pip install -q openpyxl   # be naršyklės žingsnio nebūna įdiegta
            python build_site.py
          fi

      # Svetainės patikra: kiekvienas puslapis atsidaro be klaidų, pagrindinės lentelės užpildytos (tools/smoke_test.py);
      # problema įrašoma į source_status.json ir matoma vakariniame laiške bei svetainės pranešimuose
      - name: Website check
        if: always()
        continue-on-error: true
        run: python -u tools/smoke_test.py

      # Viena kasdienė ataskaita el. paštu: pirmame paleidime po 16:00 UTC (~19:00 Vilniaus laiku vasarą),
      # nesvarbu, ar jį paleido tvarkaraštis, ar išorinis žadintuvas (daily_report.py siunčia tik kartą per dieną),
      # arba paleidus ranka su „send_report“. Jei Gmail nustatymų (Secrets) dar nėra – ataskaita
      # vieną kartą per dieną paskelbiama kaip „Issue“ komentaras.
      - name: Daily report (e-mail)
        id: report
        if: always() && (github.event.schedule != '37 4 * * 1-6' || inputs.send_report)
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_REPORT: ${{ inputs.send_report && 'true' || 'false' }}
        run: |
          if [ "$FORCE_REPORT" != "true" ] && [ "$(date -u +%-H)" -lt 16 ]; then
            echo "Dar ne vakaras – ataskaitą siųsime vėlesniame paleidime."
            exit 0
          fi
          [ "$FORCE_REPORT" = "true" ] && rm -f data/report_state.json
          python daily_report.py send

      - name: Daily report fallback (GitHub issue comment)
        if: always() && steps.report.outputs.fallback == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Duomenų surinkimo ataskaitos in:title" --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            gh issue create --title "Duomenų surinkimo ataskaitos (testavimas)" --body-file report.md
          else
            gh issue comment "$NUM" --body-file report.md
          fi
          rm -f report.md

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/ops_log.py || true   # įvykių žurnalas „Duomenų kalendoriui“ (kas atkeliavo, kas nepavyko)
          git add data/nav_history.csv data/pillar3_history.csv data/update_state.json data/report_state.json data/last_update_log.txt docs
          if [ -f data/ops_log.csv ]; then git add data/ops_log.csv; fi
          # paskutinė gauta €STR norma: jei kitą kartą ECB nepasieks, svetainė naudos ją, o ne 2 %
          if [ -f data/risk_free.json ]; then git add data/risk_free.json; fi
          if [ -f data/estr_monthly.json ]; then git add data/estr_monthly.json; fi
          if [ -f data/source_status.json ]; then git add data/source_status.json; fi
          if [ -f data/isin_names.csv ]; then git add data/isin_names.csv; fi
          if [ -f data/security_terms.csv ]; then git add data/security_terms.csv; fi
          if [ -f data/indexes.csv ]; then git add data/indexes.csv; fi
          git add imports/journey/cpi.csv imports/journey/pensions.csv imports/journey/wages.csv
          git add imports/lb_results imports/lb_portfolios imports/lb_fees data/portfolios.csv data/fees.csv
          if [ -n "$(ls -A imports/lb_archive 2>/dev/null)" ]; then git add imports/lb_archive; fi
          if [ -f data/lb_files.json ]; then git add data/lb_files.json; fi
          if [ -f data/lb_results_history.csv ]; then git add data/lb_results_history.csv; fi
          git add data/baltic_*.csv 2>/dev/null || true
          git add data/news.csv 2>/dev/null || true
          git add data/seimas.csv 2>/dev/null || true
          git add data/lv_reports.csv data/lv_holdings.csv data/lv_files.csv data/baltic_lv_lb.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nėra pakeitimų."
          else
            git commit -m "data: update $(TZ=Europe/Vilnius date '+%Y-%m-%d %H:%M')"
            # Kol šis paleidimas veikė, kas nors galėjo įkelti svetainės pakeitimų (docs/ – sugeneruoti failai, todėl
            # konfliktai neišvengiami). Konflikte imame savo versiją (-X theirs = šio paleidimo commit'as), o jei
            # tarp to pasikeitė svetainės šaltiniai – svetainę sugeneruojame iš naujo, kad nedingtų ir jų pakeitimai.
            BASE=$(git rev-parse HEAD~1)
            ok=0
            for i in 1 2 3 4; do
              if git pull --rebase -X theirs origin main; then
                if ! git diff --quiet "$BASE" HEAD -- site '*.py'; then
                  python -c "import openpyxl" 2>/dev/null || pip install -q openpyxl
                  python build_site.py > /dev/null && git add docs
                  git diff --cached --quiet || git commit -m "site: rebuild after merge $(TZ=Europe/Vilnius date '+%Y-%m-%d %H:%M')"
                fi
                if git push; then ok=1; break; fi
              else
                git rebase --abort || true
              fi
              sleep $((i * 20))
            done
            [ "$ok" = 1 ] || { echo "Nepavyko įkelti duomenų po 4 bandymų"; exit 1; }
          fi
