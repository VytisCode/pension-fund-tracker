name: Update fund data

# Darbo dienomis kas valandą nuo ~14:15 iki ~18:15 Vilniaus laiku (UTC+3 vasarą; žiemą viena valanda anksčiau),
# be to ryte (~07:30, antradienį–šeštadienį) papildomas paleidimas praėjusios dienos spragoms užpildyti.
# Kiekvienas tiekėjas tikrinamas tik jei saugykloje dar nėra laukiamos dienos duomenų,
# todėl kai viskas jau atnaujinta, paleidimas baigiasi per kelias sekundes.
# Ranka: Actions → "Update fund data" → Run workflow.
on:
  schedule:
    - cron: "15 11-15 * * 1-5"
    - cron: "30 4 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-fund-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOINDEX_API_SECRET_KEY: ${{ secrets.GOINDEX_API_SECRET_KEY }}
      LUMINOR_PROXY_SERVER: ${{ secrets.LUMINOR_PROXY_SERVER }}
      LUMINOR_PROXY_USERNAME: ${{ secrets.LUMINOR_PROXY_USERNAME }}
      LUMINOR_PROXY_PASSWORD: ${{ secrets.LUMINOR_PROXY_PASSWORD }}
      LUMINOR_BROWSER_RETRIES: "6"
      CATCHUP: ${{ github.event.schedule == '30 4 * * 2-6' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Light providers (Artea, Allianz, Goindex API)
        run: python -u update.py light

      - name: Does anything need a browser?
        id: need
        run: python update.py needs-browser

      - name: Install browser
        if: steps.need.outputs.needs_browser == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Browser providers (SEB, Swedbank, Luminor)
        if: steps.need.outputs.needs_browser == 'true'
        run: python -u update.py browser

      - name: Build website (only if data changed)
        if: always()
        run: |
          if git diff --quiet -- data/nav_history.csv; then
            echo "Duomenys nepasikeitė – svetainės nekeičiame."
          else
            python build_site.py
          fi

      # TESTAVIMO FAZĖ: kai paleidimas realiai bandė rinkti duomenis, į vieną „Issue“ įrašomas komentaras su ataskaita
      # (GitHub apie jį praneša el. paštu ir telefono programėlėje). Kai testavimas baigsis – ištrinkite šį žingsnį.
      - name: Test report (GitHub issue comment)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain -- data/last_update_log.txt)" ]; then
            echo "Šį kartą duomenų nebandyta rinkti – ataskaitos nereikia."
            exit 0
          fi
          {
            echo "@${{ github.repository_owner }} Duomenų surinkimo ataskaita ($(TZ=Europe/Vilnius date '+%Y-%m-%d %H:%M'))"
            echo
            echo "**Ką rado / ko nerado (šio paleidimo žurnalas):**"
            echo '```'
            awk 'BEGIN{RS="";ORS="\n\n"}{a[NR]=$0}END{for(i=(NR>1?NR-1:1);i<=NR;i++)print a[i]}' data/last_update_log.txt
            echo '```'
            echo "**Dabartinė būsena:**"
            echo '```'
            python update.py status
            echo '```'
            echo "Pilnas paleidimas: $RUN_URL"
          } > report.md
          NUM=$(gh issue list --state open --search "Duomenų surinkimo ataskaitos in:title" --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            gh issue create --title "Duomenų surinkimo ataskaitos (testavimas)" --body-file report.md
          else
            gh issue comment "$NUM" --body-file report.md
          fi
          rm -f report.md

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nav_history.csv data/update_state.json data/last_update_log.txt docs
          if git diff --cached --quiet; then
            echo "Nėra pakeitimų."
          else
            git commit -m "data: update $(TZ=Europe/Vilnius date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
