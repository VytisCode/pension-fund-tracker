name: Backfill Artea history

# Paleidžiama ranka: Actions → "Backfill Artea history" → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Artea history
        run: python backfill_artea.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nav_history.csv
          if git diff --cached --quiet; then
            echo "Nėra pakeitimų."
          else
            git commit -m "data: backfill Artea history"
            git push
          fi
