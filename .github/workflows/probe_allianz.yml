name: Probe Allianz

# Paleidžiama ranka: Actions → "Probe Allianz" → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run probe
        run: python probe_allianz.py

      - name: Commit probe results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          if git diff --cached --quiet; then
            echo "Nėra pakeitimų."
          else
            git commit -m "data: Allianz probe results"
            git pull --rebase origin main
            git push
          fi
