<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Pensijų fondų sekimas</title>
<meta name="description" content="Lithuanian third-pillar pension funds: returns, risk and history">
<link rel="stylesheet" href="style.css?v=8ce07a81">
<style>
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 4px 0 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 20px; margin-top: 2px; }
  .kpi span { font-size: 12px; color: var(--text-2); }
  .p3grid { display: grid; gap: 16px; }
  .p3grid .body { grid-template-columns: minmax(320px, 470px) 1fr; }
  @media (max-width: 860px) { .p3grid .body { grid-template-columns: 1fr; } }
  .p3grid .card table td.name { white-space: normal; }
  .tablewrap { overflow-x: auto; }
  table.p3all { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.p3all th, table.p3all td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.p3all th { cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--card); }
  table.p3all th:first-child, table.p3all td:first-child, table.p3all td.cat, table.p3all th.cat { text-align: left; }
  table.p3all td:first-child { white-space: normal; min-width: 210px; }
  table.p3all tr.sep td { background: var(--surface); font-weight: 600; text-align: left; }
  .best { font-weight: 700; }
  .note { font-size: 12.5px; color: var(--text-2); margin: 8px 0 0; }
  h2.sec { margin: 26px 0 8px; font-size: 18px; }
  table.p3mx { table-layout: fixed; width: 100%; min-width: 640px; }
  table.p3mx th { white-space: normal; font-size: 11.5px; vertical-align: bottom; font-weight: 600; }
  table.p3mx th:first-child, table.p3mx td:first-child { width: 200px; white-space: normal; }
  table.p3mx td { font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <div class="kpis" id="kpis"></div>
  <div class="controls bar sticky" style="margin:14px 0 22px">
    <div class="seg" id="periods" role="group"></div>
  </div>
  <div data-tab="cat"><div class="p3grid" id="groups"></div></div>
  <div data-tab="rdd"><h2 class="sec" id="rddTitle"></h2>
  <section class="card" id="rdd"></section></div>
  <div data-tab="all"><h2 class="sec" id="allTitle"></h2>
  <section class="card" data-src="p3"><div class="tablewrap scroll"><table class="p3all" id="all"></table></div><p class="note" id="allNote"></p><div class="tools"><button class="btn xls" type="button" id="allXls"></button></div></section>
  </div>
  <footer id="foot"></footer>
</div>
<script src="data3.js?v=7eff5ed3"></script>
<script src="events.js?v=37e94529"></script>
<script src="common.js?v=dbdab785"></script>
<script src="p3.js?v=393fe04e"></script>
</body>
</html>
