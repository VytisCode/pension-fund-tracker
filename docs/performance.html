<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance & peers</title>
<meta name="description" content="Performance analysis and peer comparison of Lithuanian second-pillar pension funds">
<link rel="stylesheet" href="style.css?v=56706728">
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <div class="printonly" id="printMeta"></div>
  <div class="top-actions" id="actions">
    <button class="btn" type="button" id="btnShare"></button>
    <button class="btn" type="button" id="btnXlsx"></button>
    <button class="btn" type="button" id="btnPrint"></button>
  </div>

  <div class="bar sticky" id="periodbar">
    <div class="seg" id="periods" role="group"></div>
    <div class="dates"><label class="field"><span id="lblFrom"></span><input type="date" id="from"></label>
    <label class="field"><span id="lblTo"></span><input type="date" id="to"></label></div>
  </div>

  <section class="sec">
    <h2 id="hSum"></h2>
    <div class="tools" style="margin:0 0 10px"><div class="seg" id="sumWin" role="group"></div></div>
    <div id="sumText"></div>
    <div class="card scroll"><table class="metrics" id="tSum"></table></div>
    <p class="note" id="nSum"></p>
  </section>

  <section class="sec">
    <h2 id="hMarket"></h2>
    <div class="meta" id="mMarket"></div>
    <div class="two">
      <div><div class="group-h" id="hRet"></div><div class="scroll"><table class="mx" id="tRet"></table></div></div>
      <div><div class="group-h" id="hRank"></div><div class="scroll"><table class="mx" id="tRank"></table></div></div>
    </div>
    <div class="two">
      <div><div class="group-h" id="hQ"></div><div class="scroll"><table class="mx" id="tQ"></table></div></div>
      <div>
        <div class="group-h"><span id="hOv"></span> <select id="ovH"></select></div>
        <div class="scroll"><table class="metrics" id="tOv"></table></div>
      </div>
    </div>
    <p class="note" id="nMarket"></p>
  </section>

  <section class="sec">
    <h2 id="hFund"></h2>
    <div class="bar" style="margin-bottom:12px">
      <label class="field"><span id="lblGroup"></span><select id="group"></select></label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="card">
      <div class="meta" id="mChart"></div>
      <div class="chart" id="chart"></div>
      <div class="tools">
        <div class="seg" id="viewSeg" role="group"></div>
        <button class="btn" type="button" id="resetZoom" hidden></button>
        <button class="btn" type="button" id="btnEvents" aria-pressed="false"></button><span id="evInfo" style="margin-left:-4px"></span>
        <button class="btn" type="button" id="btnPng"></button>
        <span class="note" id="zoomHint" style="margin:0"></span>
      </div>
      <ul class="evlist" id="evList"></ul>
    </div>
    <div class="cov" id="cov" hidden></div>

    <div class="group-h" id="hMetrics"></div>
    <div class="card scroll"><table class="metrics" id="tMetrics"></table></div>
    <div class="group-h" id="hCal"></div>
    <div class="card scroll"><table class="metrics" id="tCal"></table></div>
    <div class="group-h" id="hRoll"></div>
    <div class="card scroll"><table class="metrics" id="tRoll"></table></div>
    <div class="group-h" id="hQP"></div>
    <div class="card scroll"><table class="mx" id="tQP"></table></div>
    <div class="group-h"><span id="hHm"></span> <select id="hmProv"></select></div>
    <div class="card scroll"><table class="hm" id="tHm"></table></div>

    <div class="tools" id="optional-toggle"><button class="btn" type="button" id="btnAdv" aria-pressed="false"></button></div>
    <div class="adv" id="adv">
      <div class="card scroll">
        <div class="tools" style="margin:0 0 10px"><label class="field"><span id="lblRf"></span><input class="small-in" type="number" id="rf" step="0.25" min="0" max="20"> %</label></div>
        <table class="metrics" id="tAdv"></table>
      </div>
      <p class="note" id="nAdv"></p>
    </div>
    <p class="note" id="nFund"></p>
  </section>
  <footer id="foot"></footer>
</div>
<div id="pop" role="tooltip"></div>
<script src="data.js?v=a8c7b8ea"></script>
<script src="events.js?v=5b59ef9e"></script>
<script src="common.js?v=3cd45310"></script>
<script src="perf.js?v=aad7fb56"></script>
</body>
</html>
