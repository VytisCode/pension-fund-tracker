<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pension fund tracker</title>
<meta name="description" content="Lithuanian second-pillar pension funds by birth-year group">
<link rel="stylesheet" href="style.css?v=3b284c32">
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <div class="controls">
    <div class="seg" id="periods" role="group"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="grid" id="groups"></div>
  <footer id="foot"></footer>
</div>
<script src="data.js?v=c0773e6a"></script>
<script src="common.js?v=eae6ffb7"></script>
<script>
addStrings({
  foot: 'Return = change in unit value over the period (from the value on the starting date to the latest common date within each group); it is not annualised. Different providers\' unit values differ, so funds are compared by percentage return. Net assets show the latest known value. Data is collected automatically from the providers\' websites and APIs; for information only, not investment advice.',
}, {
  foot: 'Grąža = vieneto vertės pokytis laikotarpyje (nuo pradžios dienos vertės iki bendros paskutinės dienos kiekvienoje grupėje); nėra metinė. Skirtingų tiekėjų vieneto vertės skiriasi, todėl fondai lyginami procentine grąža. Grynieji aktyvai – naujausia žinoma reikšmė. Duomenys renkami automatiškai iš tiekėjų svetainių ir API; tai informacinė medžiaga, ne investavimo rekomendacija.',
});
const LATEST = Math.max(...DATA.groups.map(g => groupEnd(g).end)), EARLIEST = Math.min(...DATA.groups.flatMap(g => g.funds.map(f => f.d[0])));
const CAL_OPTS = calOptions(LATEST, EARLIEST);
let period = 'ytd';
try { const s = localStorage.getItem('period'); if (PRESET_IDS.includes(s) || isCalPeriod(s)) period = s; } catch (e) {}

function compute(group) {
  const { end, overallLast } = groupEnd(group);
  const { anchor, end: e2 } = presetRangeF(period, end, group.funds, maxAnchorOf(group.funds));
  const live = group.funds.filter(f => f.d[f.d.length - 1] >= overallLast - 5);
  const rows = group.funds.map(f => {
    const stale = f.d[f.d.length - 1] < overallLast - 5;
    const s = stale ? null : seriesOf(f, anchor, e2);
    const ie = lastOnOrBefore(f, e2);
    return { f, ret: s ? s.ret : null, unit: ie >= 0 ? f.v[ie] : null, stale };
  });
  rows.sort((a, b) => (b.ret ?? -1e9) - (a.ret ?? -1e9));
  return { rows, end: e2, anchor, series: buildSeries(live, anchor, e2) };
}

const cards = [];
function paintCard(c, mr) {
  c.ctl = drawLineChart(c.chart, c.data.series, c.data.anchor, c.data.end, { mr, height: Math.max(260, Math.min(420, Math.round((c.chart.clientWidth || 600) * 0.42))), unit: ' %', axisUnit: '%' });
  const narrow = (c.chart.clientWidth || 0) <= 560;
  c.fin.innerHTML = narrow ? c.data.series.map(r => ({ r, v: r.points[r.points.length - 1][1] })).sort((a, b) => b.v - a.v).map(o => `<span><i style="background:${colorOf(o.r.provider)}"></i>${labelOf(o.r.provider)} <b>${pct(o.v, 1).replace(' %', '%')}</b></span>`).join('') : '';
}
function render() {
  const root = document.getElementById('groups'); root.innerHTML = ''; cards.length = 0;
  let latest = 0;
  DATA.groups.forEach(g => {
    const data = compute(g); latest = Math.max(latest, data.end);
    const card = document.createElement('section'); card.className = 'card';
    const late = data.series.hidden.map(h => `${labelOf(h.provider)} (${iso(h.start)})`);
    card.innerHTML = `<h2>${groupLabel(g)}</h2><div class="meta">${periodLabel(period)}: ${iso(data.anchor)} → ${iso(data.end)}${late.length ? ' ' + T().notShown(late.join(', ')) : ''}</div>
      <div class="body"><table><thead><tr><th>${T().thProvider}</th><th>${T().thReturn}</th><th class="hide-s">${T().thUnit}</th><th>${T().thAssets}</th></tr></thead><tbody></tbody></table><div><div class="chart"></div><div class="finals"></div></div></div>`;
    const tb = card.querySelector('tbody');
    data.rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      const ret = r.ret === null ? `<span class="na">${r.stale ? T().noNew : '–'}</span>` : `<span class="${r.ret >= 0 ? 'pos' : 'neg'}">${pct(r.ret)}</span>`;
      tr.innerHTML = `<td class="name"><span class="rank">${r.ret === null ? '' : i + 1}</span><span class="sw" style="background:${colorOf(r.f.provider)}"></span>${labelOf(r.f.provider)}</td>
        <td>${ret}</td><td class="hide-s">${r.unit === null ? '–' : num(r.unit, 4)}</td><td>${r.f.assets ? num(r.f.assets / 1e6, 1) : '<span class="na">–</span>'}</td>`;
      tb.appendChild(tr);
    });
    root.appendChild(card);
    const c = { chart: card.querySelector('.chart'), fin: card.querySelector('.finals'), data, ctl: null };
    c.hc = hoverCompress(c.chart, mr => paintCard(c, mr));
    cards.push(c);
  });
  document.getElementById('sub').textContent = `${T().dataUntil} ${iso(latest)} · ${T().updated} ${DATA.generated}`;
  document.getElementById('foot').textContent = T().foot;
  cards.forEach(c => paintCard(c, 16));
}

const pe = document.getElementById('periods');
function labelPeriods() {
  pe.setAttribute('aria-label', T().period);
  pe.querySelectorAll('button').forEach(b => b.textContent = T().periods[b.dataset.id]);
  pe.querySelectorAll('select.segsel').forEach(sel => {
    const k = sel.dataset.kind, active = period.startsWith(k + ':');
    sel.innerHTML = `<option value="">${k === 'q' ? T().qPlace : T().yPlace}</option>` + CAL_OPTS[k].map(id => `<option value="${id}">${periodLabel(id)}</option>`).join('');
    sel.value = active ? period : ''; sel.classList.toggle('active', active);
  });
}
PRESET_IDS.forEach(id => {
  if (id === 'Q' || id === 'Y') {
    const sel = document.createElement('select'); sel.className = 'segsel'; sel.dataset.kind = id.toLowerCase();
    sel.addEventListener('change', () => { if (!sel.value) return; period = sel.value; try { localStorage.setItem('period', period); } catch (e) {} sync(); render(); });
    pe.appendChild(sel); return;
  }
  const b = document.createElement('button'); b.type = 'button'; b.dataset.id = id;
  b.addEventListener('click', () => { period = id; try { localStorage.setItem('period', id); } catch (e) {} sync(); render(); });
  pe.appendChild(b);
});
function sync() { pe.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === period)); labelPeriods(); }
document.getElementById('legend').innerHTML = DATA.providers.map(p => `<span><i style="background:${colorOf(p.id)}"></i>${p.label}</span>`).join('');
renderHeader('overview', () => { sync(); render(); });
sync(); render();
let resizeTimer; addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => cards.forEach(c => paintCard(c, c.hc.mr)), 120); });
</script>
</body>
</html>
