<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Pensijų fondų sekimas</title>
<meta name="description" content="Lithuanian pension funds: one manager's report tables">
<link rel="stylesheet" href="style.css?v=8ce07a81">
<style>
  h2.sec { margin: 26px 0 4px; font-size: 19px; }
  p.lead { color: var(--text-2); font-size: 13.5px; margin: 0 0 12px; max-width: 920px; }
  .rbar { margin: 4px 0 12px; }
  table.rt { font-size: 13px; }
  table.rt th { white-space: normal; vertical-align: bottom; }
  table.rt td.l, table.rt th.l { text-align: left; white-space: nowrap; }
  table.rt td.rk { color: var(--text-3); font-size: 11.5px; text-align: center; width: 22px; }
  table.rt tr.sep td { background: var(--surface); font-weight: 600; text-align: left; }
  table.rt tr.tot td { border-top: 2px solid var(--line); font-weight: 700; }
  table.rt td.bl, table.rt th.bl { border-left: 1px solid var(--line); }
  table.rt td.hc { color: #1a1a19; }
  table.rt td.hc.b { font-weight: 700; }
  table.rt td.na { color: var(--text-3); }
  .good { background: #b9e3a6; color: #1a1a19; } .bad { background: #f4b0aa; color: #1a1a19; }
  .up { color: var(--s5); font-weight: 600; } .down { color: #d0453f; font-weight: 600; }
  .rsub { color: var(--text-3); font-size: 12px; }
  h2.sec .btn.xls { font-size: 12px; padding: 3px 9px; margin-left: 8px; vertical-align: 2px; font-weight: 500; }
  #pop { max-width: 560px; white-space: pre-line; }
  table.lbt td:not(.l), table.lbt th:not(.l) { min-width: 70px; }
  @media print { h2.sec .btn.xls { display: none; } h2.sec { margin-top: 14px; } }
  .bar .field { max-width: 100%; min-width: 0; flex-wrap: wrap; }   /* siaurame ekrane pasirinkimai neplatina puslapio */
  .bar select { max-width: 100%; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  section.hy { margin-bottom: 12px; } section.hy h3 { font-size: 14.5px; margin: 0 0 8px; }
  .hyhead { margin: 0 0 12px; font-size: 13.5px; }
  .hy2 { gap: 12px; } table.rt.lbt th { min-width: 70px; }
</style>
</head>
<body data-daily="rep_daily.js?v=343fea40" data-pf="data_pf.js?v=9f86a25f">
<div class="wrap">
  <header id="top"></header>
  <div class="bar sticky" id="mgrBar"></div>
  <div class="printonly" id="printMeta"></div>

  <div data-tab="cal">
  <h2 class="sec" id="calTitle"></h2>
  <p class="lead" id="calLead"></p>
  <section class="card" data-src="rep"><div class="scroll"><table class="rt" id="calTable"></table></div><p class="note" id="calNote"></p></section>
  </div>

  <div data-tab="mon">
  <h2 class="sec" id="monTitle"></h2>
  <section class="card" data-src="rep"><div class="scroll"><table class="rt" id="monTable"></table></div><p class="note" id="monNote"></p></section>
  </div>

  <div data-tab="kpi">
  <h2 class="sec" id="kpiTitle"></h2>
  <p class="lead" id="kpiLead"></p>
  <div class="bar rbar" id="kpiBar"></div>
  <section class="card" data-src="rep"><div class="scroll"><table class="rt" id="kpiTable"></table></div><p class="note" id="kpiNote"></p></section>
  </div>

  <div data-tab="hy">
  <h2 class="sec" id="hyTitle"></h2>
  <p class="lead" id="hyLead"></p>
  <div class="bar rbar" id="hyBar"></div>
  <div id="hyBody"></div>
  <div data-src="pf"></div>
  </div>

  <div data-tab="kid">
  <div id="kidWrap">
  <h2 class="sec" id="kidTitle"></h2>
  <p class="lead" id="kidLead"></p>
  <section class="card" data-src="kid"><div id="kidBox"></div></section>
  </div>
  </div>

  <footer id="foot"></footer>
</div>
<div id="pop" role="tooltip"></div>
<script src="common.js?v=dbdab785"></script>
<script src="data_rep.js?v=7af73706"></script>
<script src="hy.js?v=c6995352"></script>
<script src="kid.js?v=bec48f2e"></script>
<script src="rep.js?v=9731fa19"></script>
</body>
</html>
