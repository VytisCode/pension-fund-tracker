<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Pensijų fondų sekimas</title>
<meta name="description" content="Lithuanian pension funds: net assets over time and reform payouts">
<link rel="stylesheet" href="style.css?v=a997ec9e">
<style>
  h2.sec { margin: 26px 0 4px; font-size: 19px; }
  p.lead { color: var(--text-2); font-size: 13.5px; margin: 0 0 12px; max-width: 920px; }
  .pfbar { margin: 4px 0 12px; }
  table.at { font-size: 13px; }
  table.qt td .pfsub { font-size: 11px; font-weight: 500; }
  table.qt td .pfsub.up { color: var(--s5); } table.qt td .pfsub.down { color: #d0453f; }
  table.at tr.sep td { background: var(--surface); font-weight: 600; text-align: left; }
  table.at th { white-space: normal; vertical-align: bottom; }
  table.at th.grp { text-align: center; border-bottom: 1px solid var(--line); }
  table.at td.l, table.at th.l { text-align: left; }
  table.at tr.tot td { border-top: 2px solid var(--line); font-weight: 700; }
  table.at tr.sep td { background: var(--surface); font-weight: 600; text-align: left; }
  table.at td.bl, table.at th.bl { border-left: 1px solid var(--line); }
  .up { color: var(--s5); font-weight: 600; } .down { color: #d0453f; font-weight: 600; }
  .est { color: var(--text-3); }
  .pfsub { color: var(--text-3); font-size: 12px; }
  table.at td.heat { color: #1a1a19; font-weight: 600; }
  table.at td.heat sup { font-weight: 500; font-size: 10px; opacity: .75; margin-left: 2px; }
  table.at td.heat .est { color: #1a1a19; opacity: .7; }
  table.at td.tt { font-weight: 600; }
  #chLegend .chip { font-size: 13px; }
  #chLegend .chip b { color: var(--text); }
  .fpick { position: relative; font-size: 13px; }
  .fpick summary { cursor: pointer; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); list-style: none; }
  .fpick summary::after { content: ' ▾'; color: var(--text-3); }
  .fpick .fplist { position: absolute; z-index: 20; margin-top: 4px; max-height: 420px; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); min-width: 280px; }
  .fpick .fplist label { display: block; padding: 2px 0; white-space: nowrap; }
  .fpick .fpm { margin: 8px 0 2px; } .fpick .fpm:first-child { margin-top: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header id="top"></header>

  <div data-tab="ch">
  <h2 class="sec" id="chTitle"></h2>
  <p class="lead" id="chLead"></p>
  <div class="bar pfbar" id="chBar"></div>
  <section class="card" data-src="aum"><div class="meta" id="chMeta"></div><div class="chart" id="chart"></div><div class="legend" id="chLegend" style="margin-top:6px"></div><p class="note" id="chNote"></p></section>
  </div>

  <div data-tab="dc">
  <h2 class="sec" id="dcTitle"></h2>
  <p class="lead" id="dcLead"></p>
  <section class="card" data-src="aum"><div class="meta" id="dcMeta"></div><div class="chart" id="dcChart"></div><div class="scroll" style="margin-top:10px"><table class="at" id="dcTable"></table></div><p class="note" id="dcNote"></p><div class="tools"><button class="btn xls" type="button" id="dcXls"></button></div></section>
  </div>

  <div data-tab="gt">
  <h2 class="sec" id="gtTitle"></h2>
  <section class="card" data-src="aum"><div class="scroll"><table class="at" id="gtTable"></table></div><p class="note" id="gtNote"></p></section>
  </div>

  <div data-tab="qt">
  <h2 class="sec" id="qtTitle"></h2>
  <section class="card" data-src="aum"><div class="scroll"><table class="at qt" id="qtTable"></table></div><p class="note" id="qtNote"></p></section>
  </div>

  <div data-tab="po">
  <h2 class="sec" id="poTitle"></h2>
  <p class="lead" id="poLead"></p>
  <div class="bar pfbar" id="poBar"></div>
  <section class="card" data-src="aum"><div class="scroll"><table class="at" id="poTable"></table></div><p class="note" id="poNote"></p></section>
  </div>

  <footer id="foot"></footer>
</div>
<script src="common.js?v=98254bf5"></script>
<script src="data_aum.js?v=e44b56c9"></script>
<script src="aum.js?v=27a7b2eb"></script>
</body>
</html>
