<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Pension fund tracker</title>
<meta name="description" content="Lithuanian II pillar: one participant's path from the first contribution to retirement">
<link rel="stylesheet" href="style.css?v=d081eabe">
<style>
  h2.sec { margin: 26px 0 4px; font-size: 19px; }
  h2.sec .btn.xls { font-size: 12px; padding: 3px 9px; margin-left: 8px; vertical-align: 2px; font-weight: 500; }
  p.lead { color: var(--text-2); font-size: 13.5px; margin: 0 0 12px; max-width: 920px; }
  .bar input[type=number] { width: 80px; }
  table.jt tr.cur td { font-weight: 650; }
  .bar select, .bar input { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 860px) { .kpis, .kpis.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi .l { color: var(--text-3); font-size: 12px; }
  .kpi .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .s { color: var(--text-3); font-size: 12px; margin-top: 2px; }
  .kpi.hl { border-color: var(--accent); }
  .up { color: var(--s5); } .down { color: #d0453f; }
  .story { font-size: 14px; line-height: 1.6; max-width: 920px; margin: 0; }
  .story p { margin: 0 0 8px; }
  .prof { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 18px; font-size: 13px; color: var(--text-2); margin-top: 10px; }
  @media (max-width: 860px) { .prof { grid-template-columns: 1fr; } }
  .prof b { color: var(--text); font-weight: 600; }
  .two { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .shares .row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .shares .row span:nth-child(3) { color: var(--text-3); min-width: 42px; text-align: right; }
  .sbar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 4px 0 10px; }
  table.jt { font-size: 13px; }
  table.jt th { white-space: normal; vertical-align: bottom; }
  table.jt td.l, table.jt th.l { text-align: left; }
  table.jt tr.sw td { background: color-mix(in srgb, #f2c94c 22%, var(--card)); }
  table.jt td.bl, table.jt th.bl { border-left: 1px solid var(--line); }
  table.jt td.est { color: var(--text-3); }
  .mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1100px) { .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .mgrid { grid-template-columns: 1fr; } }
  .mgrid .card { padding: 10px 12px; margin: 0; }
  .mgrid .mt { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .mgrid .ms { font-size: 12px; color: var(--text-3); min-height: 16px; }
  .mgrid .chart { position: relative; }
  .tmap { display: grid; height: 220px; gap: 3px; margin-top: 6px; }
  .tmap div { border-radius: 6px; padding: 8px; color: #fff; font-size: 12px; line-height: 1.35; overflow: hidden; }
  .tmap div b { display: block; font-size: 15px; }
  h3.sub3 { font-size: 15px; margin: 20px 0 8px; }
  #srcBody h3.sub3:first-of-type { margin-top: 8px; }
  ul.srcl { margin: 0 0 6px; padding-left: 20px; font-size: 13.5px; line-height: 1.55; color: var(--text-2); max-width: 980px; }
  ul.srcl li { margin: 3px 0; }
  #srcBody a { color: var(--accent); }
  a.srclink { font-size: 12.5px; font-weight: 400; margin-left: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  a.srclink:hover { text-decoration: underline; }
  h2.sec { scroll-margin-top: 56px; }
  #inBar { align-items: stretch; gap: 10px 22px; }
  #inBar .grp { display: flex; flex-direction: column; gap: 6px; padding-left: 10px; border-left: 3px solid var(--line); }
  #inBar .grp.g2, #inBar .grp.g3 { border-left-color: var(--accent); }
  #inBar .gl { font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); }
  #inBar .gf { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .jnav { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 2px; margin-top: 10px; padding: 6px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 12px -10px rgba(0,0,0,.35); }
  .jnav a { font-size: 13px; color: var(--text-2); text-decoration: none; padding: 3px 9px; border-radius: 7px; }
  .jnav a:hover { background: var(--grid); color: var(--text); }
  @media (max-width: 700px) { .jnav { position: static; } }
  #pop { max-width: 560px; white-space: pre-line; }
  #staleBox .stale { margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--warn); border-radius: 10px; background: var(--card); font-size: 13.5px; line-height: 1.5; }
  #staleBox .stale b { color: var(--warn); }
  #staleBox .stale ul { margin: 4px 0 0; padding-left: 20px; }
  #staleBox .stale a, #srcBody a { color: var(--accent); }
  table.fresht { border-collapse: collapse; font-size: 13px; margin: 4px 0 6px; }
  table.fresht th, table.fresht td { text-align: left; padding: 4px 14px 4px 0; border-bottom: 1px solid var(--grid); }
  table.fresht th { color: var(--text-3); font-weight: 500; }
  table.fresht td.late { color: var(--warn); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <div class="bar" id="inBar"></div>
  <nav class="jnav" id="jnav"></nav>
  <div id="staleBox"></div>

  <h2 class="sec" id="schTitle"></h2>
  <p class="lead" id="schLead"></p>
  <section class="card"><div id="schema"></div></section>
  <section class="card" style="margin-top:14px"><div class="story" id="story"></div><div class="prof" id="prof"></div></section>

  <h2 class="sec" id="sumTitle"></h2>
  <div class="kpis" id="kpiA"></div>

  <h2 class="sec" id="chTitle"></h2>
  <div class="two">
    <section class="card"><div class="meta" id="chMeta"></div><div class="chart" id="chart" style="position:relative"></div><div class="legend" id="chLegend" style="margin-top:6px"></div></section>
    <section class="card"><div class="meta" id="shMeta"></div><div class="shares" id="shares"></div></section>
  </div>

  <h2 class="sec" id="annTitle"></h2>
  <section class="card"><div class="scroll"><table class="jt" id="annTable"></table></div><p class="note" id="annNote"></p></section>

  <h2 class="sec" id="cmpTitle"></h2>
  <p class="lead" id="cmpLead"></p>
  <section class="card"><div class="scroll"><table class="jt" id="cmpTable"></table></div><p class="note" id="cmpNote"></p></section>

  <h2 class="sec" id="ixTitle"></h2>
  <p class="lead" id="ixLead"></p>
  <section class="card"><div class="meta" id="ixMeta"></div><div class="chart" id="ixChart" style="position:relative"></div><div class="legend" id="ixLegend" style="margin-top:6px"></div></section>
  <section class="card" style="margin-top:12px"><div class="scroll"><table class="jt" id="ixTable"></table></div><p class="note" id="ixNote"></p></section>

  <h2 class="sec" id="gridTitle"></h2>
  <p class="lead" id="gridLead"></p>
  <div class="mgrid" id="mgrid"></div>

  <h2 class="sec" id="tbTitle"></h2>
  <p class="lead" id="tbLead"></p>
  <div class="bar" id="tbBar" style="margin-bottom:12px"></div>
  <section class="card"><div class="scroll"><table class="jt" id="tbl"></table></div><p class="note" id="tbNote"></p></section>

  <h2 class="sec" id="insTitle" style="margin-top:40px"></h2>
  <p class="lead" id="insLead"></p>
  <div id="insBody"></div>

  <h2 class="sec" id="srcTitle" style="margin-top:40px"></h2>
  <section class="card" id="srcBody"></section>

  <footer id="foot"></footer>
</div>
<div id="pop" role="dialog"></div>
<script src="common.js?v=d03d9cc6"></script>
<script src="data.js?v=4fa7860a"></script>
<script src="data_idx.js?v=7b8d8cd1"></script>
<script src="data_journey.js?v=5f38f7f1"></script>
<script src="data_journey3.js?v=ce4dfb55"></script>
<script src="journey.js?v=2ab8a31b"></script>
<script src="insights.js?v=e911366e"></script>
</body>
</html>
