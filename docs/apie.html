<script>
/* „Apie ir metodika“ (auditas #53, #57): iš kur kiekvienas duomuo, kaip dažnai atnaujinama, formulės, prielaidos, žinomi apribojimai.
   Skyrių id naudojami nuorodose „Metodika →“ po lentelėmis (common.js srcLines). Be nuorodų į kodą. */
const DOC = {
lt: {
  h0: 'Apie ir metodika', lead: 'Kiekvienam duomeniui – iš kur jis gaunamas, kaip dažnai atnaujinamas, kaip skaičiuojama ir ką reikia žinoti. Po kiekviena svetainės lentele yra nuoroda į atitinkamą skyrių.',
  src: 'Šaltinis', upd: 'Atnaujinama', calc: 'Skaičiavimas', lim: 'Žinomi apribojimai', last: 'Paskutiniai duomenys',
  secs: [
    { id: 'nav', h: 'II pakopos vieneto vertės ir grąža', src: 'Valdytojų (Allianz, Artea, Goindex, Luminor, SEB, Swedbank) svetainės ir viešos duomenų sąsajos; istorija nuo 2018-12 – valdytojų failai.',
      upd: 'Darbo dienomis po pietų kas 30 min. ir kitą rytą (jei vertė dar nepaskelbta).',
      calc: 'Grąža = paskutinė vieneto vertė ÷ vertė laikotarpio pradžioje − 1. Vertės jau po valdymo mokesčio, todėl mokesčiai antrą kartą neatimami. Metinė grąža = (1 + grąža)^(365,25 ÷ dienos) − 1; čia metai skaičiuojami kalendorinėmis dienomis (365,25 d.), o LB ataskaitų lentelėse – mėnesiais (metai = mėnesiai ÷ 12), kad sutaptų su LB skaičiais, todėl to paties laikotarpio metinė grąža šiose dviejose vietose gali šiek tiek skirtis. Svyravimas – dienų, kai vertė pasikeitė, grąžų standartinis nuokrypis × √252. Valdytojo grąža rodoma dviem būdais: paprastas jo gyvenimo ciklo fondų vidurkis (kiekvienas fondas sveria vienodai) ir svertinis vidurkis pagal fondų paskutinius grynuosius aktyvus (didesni fondai sveria daugiau – arčiau to, kaip sekėsi visiems valdytojo dalyvių pinigams). Fondai lyginami tik savo gimimo metų grupėje; turto išsaugojimo – tarpusavyje. Laikotarpio pabaiga – bendra paskutinė visų atnaujintų valdytojų diena.',
      lim: ['Valdytojai vertes skelbia skirtingu metu; vėluojantis valdytojas pažymimas antraštėje, o jo grąža skaičiuojama iki jo paskutinės dienos.', 'Luminor svetainė dažnai blokuoja automatinį skaitymą – vertės kartais ateina vėliau.', '2003–2009 fondai pradėti 2025-01-02 už 1,00 € – jų grąža skaičiuojama nuo pirmos vertės.', 'Reali grąža (be infliacijos) naudoja paskutinį paskelbtą VKI, jei naujausio mėnesio dar nėra.', 'Svertinis vidurkis naudoja paskutinius žinomus aktyvus, ne laikotarpio pradžios – ilgiems laikotarpiams tai apytikslis svoris; fondai be aktyvų duomenų į jį neįtraukiami.'] },
    { id: 'aum', h: 'Grynieji aktyvai (AUM) ir reformos išmokos', src: 'Valdytojų skelbiami fondų grynieji aktyvai (kasdien); trūkstamos 2026 m. dienos – savininko pateiktas failas.',
      upd: 'Kartu su vieneto vertėmis.',
      calc: 'Pinigų srautas = aktyvai dabar − aktyvai vakar × (vieneto vertė dabar ÷ vieneto vertė vakar), t. y. aktyvų pokytis, kurio nepaaiškina grąža. Reformos išmokų diena – didelis neigiamas srautas; dalis = srautas ÷ aktyvai prieš išmoką (perskaičiuoti pagal vertės pokytį).',
      lim: ['Įprastos įmokos ir perėjimai tarp fondų taip pat patenka į srautą – išmokų dienomis jų įtaka maža.', 'III pakopos Swedbank fondų kasdienių aktyvų nėra.'] },
    { id: 'p3', h: 'III pakopa', src: 'Valdytojų svetainės ir duomenų sąsajos (22 fondai); Goindex, SEB ir Luminor istorija – savininko pateikti failai.',
      upd: 'Darbo dienomis kartu su II pakopa.',
      calc: 'Kaip II pakopoje; fondai grupuojami pagal LB kategoriją: obligacijų, mišraus investavimo, akcijų. Svyravimas – mėnesio grąžų standartinis nuokrypis × √12 per 36 mėn.',
      lim: ['Goindex skelbia tik paskutinę vertę – istorija priklauso nuo savininko failų.', 'Kai kurie fondai įsteigti vėliau – ilgų laikotarpių grąžos jiems nėra.', 'Šis svyravimas (mėnesio grąžos × √12, 36 mėn.) nėra tiesiogiai palyginamas su II pakopos ir LB ataskaitų lentelių svyravimu (dienų grąžos × √252): jis skaičiuojamas iš kito dažnio grąžų ir per kitą laikotarpį, todėl lyginkite tik tos pačios lentelės skaičius.'] },
    { id: 'pf', h: 'Portfeliai ir pusmečio ataskaitų lentelės', src: 'Lietuvos banko ketvirtinės pensijų fondų investicijų ataskaitos (nuo 2019-09-30); vertybinių popierių pavadinimai – OpenFIGI; fondų savybės (turto klasė, regionas, SFDR, TER) – fondų dokumentai ir viešos ETF duomenų bazės; obligacijų sąlygos – ESMA FIRDS.',
      upd: 'Kartą per ketvirtį, kai Lietuvos bankas paskelbia ataskaitą (paprastai ~3 mėn. po ketvirčio pabaigos).',
      calc: 'Pozicijos dalis = vertė ÷ fondo grynieji aktyvai mėnesio pabaigoje. Rūšis: tiesioginės akcijos ir akcijų fondai – akcijos; obligacijos ir obligacijų fondai – vyriausybės (emitentas – valstybė ar jos agentūra) arba įmonių; pinigai, indėliai ir pinigų rinkos fondai – pinigų rinka (likutis iki 100 %). Regionas: besivystančios rinkos – ne MSCI išsivysčiusios šalys (Baltijos akcijos – besivystančios). Rizikingas turtas = akcijos + kitos investicijos. Sutikrinta su 20 SEB pusmečio ataskaitų: grąža, nuokrypis ir 10 didžiausių pozicijų sutampa, rūšių ir regionų dalys skiriasi iki ~1–4 p. p. dėl kelių vertybinių popierių priskyrimo.',
      lim: ['SFDR straipsnis nežinomas daliai Baltijos privataus kapitalo ir nekilnojamojo turto fondų – jie rodomi eilutėje „Nežinoma“.', 'Tiesioginės akcijos, obligacijos, indėliai ir išvestinės priemonės SFDR neturi – eilutė „Neklasifikuojama“.', 'Valdytojai kai kuriuos Lietuvos obligacijų ir privataus kapitalo fondus savo ataskaitose priskiria kitaip.'] },
    { id: 'rep', h: 'Ataskaitų lentelės (Lietuvos banko išdėstymas)', src: 'Mėnesio pabaigos vieneto vertės ir lyginamųjų indeksų vertės (valdytojai); rizikingo turto dalis pagal strategiją ir BAR – Lietuvos banko rezultatų ataskaita.',
      upd: 'Kasdien (vertės); LB rezultatų ataskaita – kartą per ketvirtį.',
      calc: '6 mėn. ir 1 m. – sukaupta grąža; 3, 5 m. ir nuo pradžios – metinė (metai = mėnesiai ÷ 12). Standartinis nuokrypis – dienų, kai vertė pasikeitė, grąžų imties nuokrypis × √252 (6 mėn. – × √126). Sutampa su LB lentelėmis 0,01 tikslumu.',
      lim: ['Lyginamojo indekso vertės yra ne visiems fondams ir ne visą laikotarpį – tada langelis tuščias.', 'Metai = mėnesiai ÷ 12 (ne 365,25 d. kaip II pakopos skiltyje), todėl metinė grąža gali šiek tiek skirtis nuo „Rezultatų“ puslapio.', 'Svyravimas (dienų grąžos × √252) nėra tiesiogiai palyginamas su III pakopos svyravimu (mėnesio grąžos × √12).'] },
    { id: 'fee', h: 'Mokesčiai', src: 'Lietuvos banko mokesčių suvestinės (II pakopa – 2026-05-15, III pakopa – 2026-01-21); išlaidų rodikliai (BAR, BIK) – LB rezultatų ataskaita.',
      upd: 'Kai Lietuvos bankas paskelbia naują suvestinę.',
      calc: 'II pakopos maksimalus valdymo mokestis – įstatymo riba 0,50 % (0,40 %, kai bendrovės turtas > 2,5 mlrd. €). SEB 2026-02-03–2026-05-17 taikė 0,40 % (išskyrus turto išsaugojimo fondą).',
      lim: ['Startinio mokesčio eurų ribos ir išimtys – tik fondo taisyklėse.'] },
    { id: 'idx', h: 'Akcijų indeksai', src: 'MSCI World ir MSCI ACWI Net Return EUR (MSCI); S&P 500 Total Return (USD) perskaičiuotas eurais pagal ECB EUR/USD kursą.',
      upd: 'Kasdien; S&P 500 eurais vėluoja 1–3 dienas.',
      calc: 'Indekso grąža skaičiuojama kaip fondų. Galima atimti mokestį: vertė × (1 − mokestis)^(dienos ÷ 365,25); numatytasis tipinio ETF mokestis – ACWI ir World 0,20 %, S&P 500 0,07 %.',
      lim: ['Indeksai neturi mokesčių, todėl be atskaitymo palyginimas fondams nepalankus.'] },
    { id: 'estr', h: 'Nerizikinga palūkanų norma (€STR)', src: 'Europos centrinis bankas: €STR nuo 2019-10-01, iki tol – EONIA.', upd: 'Kasdien.', calc: 'Naudojama Sharpe koeficientui: (metinė grąža − vidutinė €STR per tą patį laikotarpį) ÷ metinis svyravimas. Vidurkis – pagal kalendorines dienas (savaitgaliais ir šventėmis galioja paskutinė paskelbta reikšmė); iki 2019-10 – EONIA − 0,085 p. p. (ECB nustatytas ryšys tarp EONIA ir €STR).', lim: ['Jei normos istorija nepasiekiama, naudojama paskutinė €STR reikšmė.', 'Įrašyta sava norma taikoma visiems laikotarpiams.'] },
    { id: 'cpi', h: 'Infliacija (VKI)', src: 'Valstybės duomenų agentūra – Lietuvos vartotojų kainų indeksas.', upd: 'Kartą per mėnesį (~mėnesio viduryje už praėjusį mėnesį).', calc: 'Reali grąža = (1 + grąža) ÷ (VKI pabaigoje ÷ VKI pradžioje) − 1.', lim: ['Naujausiam mėnesiui naudojamas paskutinis paskelbtas indeksas.'] },
    { id: 'kid', h: 'KID veiklos rezultatų scenarijai', src: 'MSCI ACWI EUR Net Return (MSCI); euro zonos AAA vyriausybės obligacijų 7 m. pajamingumas (ECB pajamingumo kreivė) – iš jo sudaromas sintetinis obligacijų indeksas; oficialūs skaičiai – valdytojų pagrindinės informacijos dokumentai (PID).',
      upd: 'Kasdien (indeksai); scenarijai perskaičiuojami kasmet sausį (stebėjimo laikotarpis baigiasi praėjusių metų gruodžio 31 d.); PID – kartą per metus.',
      calc: 'Reglamento (ES) 2017/653 IV priedas: stebėjimo laikotarpis RHP + 5 m.; visi persidengiantys 1 m., tarpinio ir RHP ilgio langai; nuosaikus – mediana, palankus – didžiausias, nepalankus – mažiausias (ir langai, kurie baigiasi laikotarpio pabaigoje); stresinis – Cornish-Fisher su 95 / 99 procentilio nuokrypiu. 1000 € kiekvienų metų pradžioje. Kainos – akcijų dalis × MSCI ACWI + likusi dalis × obligacijų indeksas, atėmus išlaidas.',
      lim: ['Valdytojai naudoja savo lyginamuosius indeksus (pvz. Solactive), kurių istorija nevieša – todėl skaičiai apytiksliai (SEB: nepalankus, nuosaikus, palankus ±0,3 p. p.; stresinis ~3 p. p. griežtesnis).', 'Jei PID nėra, RHP ir akcijų dalis – mūsų prielaida (gyvenimo ciklo fondai – metai iki 65 m., ne daugiau 20; akcijų dalis – LB strategija).'] },
    { id: 'journey', h: 'Kelias į pensiją', src: 'Sodra (pensijų dydžiai, datos), Valstybės duomenų agentūra (darbo užmokestis, VKI), įstatymai (įmokų tarifai, valstybės skatinamoji įmoka), fondų vieneto vertės.',
      upd: 'Kartą per mėnesį arba kai keičiasi įstatymai.', calc: 'Modelis kaupia įmokas pagal tarifus ir fondo grąžą; prielaidos nurodytos puslapio apačioje.',
      lim: ['Ateities pensijos dydis – modelis, ne prognozė; Sodros pensija priklauso nuo būsimų sprendimų.'] },
  ],
  limits: 'Bendri apribojimai', limitsL: ['Duomenys renkami automatiškai iš viešų šaltinių – klaidų pasitaiko; įtartini šuoliai (> 25 % per dieną) atmetami.', 'Tai informacinė medžiaga, ne investavimo rekomendacija.', 'Excel failuose (mygtukai „⤓“ prie lentelių) – pradiniai duomenys ir tikros Excel formulės, kad kiekvieną skaičių būtų galima perskaičiuoti.'],
},
en: {
  h0: 'About and methodology', lead: 'For every piece of data: where it comes from, how often it is updated, how it is calculated and what to keep in mind. Each table on the site links to the matching section.',
  src: 'Source', upd: 'Updated', calc: 'Calculation', lim: 'Known limitations', last: 'Latest data',
  secs: [
    { id: 'nav', h: 'II pillar unit values and returns', src: 'The managers’ (Allianz, Artea, Goindex, Luminor, SEB, Swedbank) websites and public data interfaces; history from 2018-12 – the managers’ files.',
      upd: 'Business days every 30 min. in the afternoon and the next morning (if a value was not yet published).',
      calc: 'Return = latest unit value ÷ value at the start of the period − 1. Values are net of the management fee, so fees are not deducted again. Annualised = (1 + return)^(365.25 ÷ days) − 1; here a year is counted in calendar days (365.25), while the Bank of Lithuania report tables count it in months (years = months ÷ 12) to match the Bank’s figures, so the annualised return for the same period may differ slightly between the two. Volatility – standard deviation of daily returns on days when the value changed × √252. A manager’s return is shown two ways: the simple average of its life-cycle funds (each fund counts equally) and the average weighted by the funds’ latest net assets (larger funds count more – closer to how the manager’s members’ money as a whole did). Funds are compared only within their birth-year group; asset-preservation funds among themselves. The period ends on the latest common day of all up-to-date managers.',
      lim: ['Managers publish at different times; a late manager is flagged in the header and its return runs to its own latest day.', 'Luminor’s website often blocks automated reading – values sometimes arrive later.', '2003–2009 funds started on 2025-01-02 at €1.00 – their return runs from the first value.', 'Real return (after inflation) uses the latest published CPI when the newest month is not out yet.', 'The weighted average uses the latest known net assets, not those at the start of the period – for long periods the weights are approximate; funds without asset data are left out of it.'] },
    { id: 'aum', h: 'Net assets (AUM) and reform payouts', src: 'Daily net assets published by the managers; missing 2026 days – a file from the owner.', upd: 'Together with unit values.',
      calc: 'Money flow = assets today − assets yesterday × (unit value today ÷ unit value yesterday), i.e. the change in assets not explained by the return. A reform payout day is a large negative flow; share = flow ÷ assets before the payout (adjusted for the value change).',
      lim: ['Regular contributions and switches also enter the flow – on payout days their effect is small.', 'There are no daily assets for Swedbank III pillar funds.'] },
    { id: 'p3', h: 'III pillar', src: 'The managers’ websites and data interfaces (22 funds); Goindex, SEB and Luminor history – files from the owner.', upd: 'Business days, together with the II pillar.',
      calc: 'As in the II pillar; funds are grouped by the Bank of Lithuania category: bond, mixed, equity. Volatility – standard deviation of monthly returns × √12 over 36 months.',
      lim: ['Goindex publishes only the latest value – history depends on the owner’s files.', 'Some funds started later – long-period returns are not available for them.', 'This volatility (monthly returns × √12, 36 months) is not directly comparable with the II pillar and report-table volatility (daily returns × √252): it uses returns of a different frequency over a different period, so compare figures only within the same table.'] },
    { id: 'pf', h: 'Portfolios and half-year report tables', src: 'Bank of Lithuania quarterly pension fund investment reports (from 2019-09-30); security names – OpenFIGI; fund attributes (asset class, region, SFDR, TER) – fund documents and public ETF databases; bond terms – ESMA FIRDS.',
      upd: 'Once a quarter, when the Bank of Lithuania publishes the report (usually ~3 months after the quarter end).',
      calc: 'Holding share = value ÷ fund net assets at the month end. Type: direct shares and equity funds – equities; bonds and bond funds – government (issuer is a state or its agency) or corporate; cash, deposits and money market funds – money market (remainder to 100 %). Region: emerging = not an MSCI developed country (Baltic shares count as emerging). Risky assets = equities + other investments. Checked against 20 SEB half-year reports: returns, standard deviation and the top 10 holdings match; type and region shares differ by up to ~1–4 pp because of how a few securities are classified.',
      lim: ['The SFDR article is unknown for some Baltic private equity and real estate funds – they are shown as “Unknown”.', 'Direct shares, bonds, deposits and derivatives have no SFDR article – row “Not classified”.', 'Managers classify some Lithuanian bonds and private equity funds differently in their own reports.'] },
    { id: 'rep', h: 'Report tables (Bank of Lithuania layout)', src: 'Month-end unit values and benchmark values (managers); strategy risky share and cost ratio – the Bank of Lithuania results report.', upd: 'Daily (values); the results report – once a quarter.',
      calc: '6 months and 1 year – cumulative; 3, 5 years and since start – annualised (years = months ÷ 12). Standard deviation – sample standard deviation of daily returns on days when the value changed × √252 (6 months × √126). Matches the Bank of Lithuania tables to 0.01.',
      lim: ['Benchmark values are missing for some funds and periods – the cell is then empty.', 'Years = months ÷ 12 (not 365.25 days as in the II pillar section), so the annualised return may differ slightly from the Results page.', 'Volatility (daily returns × √252) is not directly comparable with the III pillar volatility (monthly returns × √12).'] },
    { id: 'fee', h: 'Fees', src: 'Bank of Lithuania fee summaries (II pillar 2026-05-15, III pillar 2026-01-21); cost ratios – the results report.', upd: 'When the Bank of Lithuania publishes a new summary.',
      calc: 'II pillar maximum management fee – the statutory cap of 0.50 % (0.40 % when the company’s assets exceed €2.5 bn). SEB applied 0.40 % from 2026-02-03 to 2026-05-17 (except the asset-preservation fund).', lim: ['Entry fee euro caps and exceptions are only in the fund rules.'] },
    { id: 'idx', h: 'Equity indices', src: 'MSCI World and MSCI ACWI Net Return EUR (MSCI); S&P 500 Total Return (USD) converted to euros at the ECB EUR/USD rate.', upd: 'Daily; S&P 500 in euros lags 1–3 days.',
      calc: 'Index returns are calculated like fund returns. A fee can be deducted: value × (1 − fee)^(days ÷ 365.25); default typical ETF fee – ACWI and World 0.20 %, S&P 500 0.07 %.', lim: ['Indices carry no fees, so without a deduction the comparison is unfavourable to funds.'] },
    { id: 'estr', h: 'Risk-free rate (€STR)', src: 'European Central Bank: €STR from 2019-10-01, EONIA before that.', upd: 'Daily.', calc: 'Used for the Sharpe ratio: (annual return − average €STR over the same period) ÷ annual volatility. The average is by calendar day (weekends and holidays carry the last published value); before 2019-10 – EONIA − 0.085 pp (the ECB’s fixed link between EONIA and €STR).', lim: ['If the rate history is unavailable, the latest €STR value is used.', 'A rate you type yourself is used for all periods.'] },
    { id: 'cpi', h: 'Inflation (CPI)', src: 'State Data Agency – Lithuanian consumer price index.', upd: 'Monthly (~mid-month for the previous month).', calc: 'Real return = (1 + return) ÷ (CPI at end ÷ CPI at start) − 1.', lim: ['For the newest month the latest published index is used.'] },
    { id: 'kid', h: 'KID performance scenarios', src: 'MSCI ACWI EUR Net Return (MSCI); euro area AAA government 7-year bond yield (ECB yield curve) – turned into a synthetic bond index; official figures – managers’ key information documents (KID).',
      upd: 'Daily (indices); scenarios are recalculated every January (the observation period ends on 31 December of the previous year); KIDs – yearly.',
      calc: 'Regulation (EU) 2017/653 Annex IV: observation period RHP + 5 years; every overlapping 1-year, intermediate and RHP window; moderate – median, favourable – maximum, unfavourable – minimum (also windows ending at the period end); stress – Cornish-Fisher with the 95th / 99th percentile volatility. 1,000 € at the start of each year. Prices – equity share × MSCI ACWI + the rest × bond index, net of costs.',
      lim: ['Managers use their own benchmarks (e.g. Solactive) whose history is not public, so the figures are approximate (SEB: unfavourable, moderate, favourable ±0.3 pp; stress ~3 pp harsher).', 'Without a KID the RHP and equity share are our assumption (life-cycle funds – years to 65, at most 20; equity share – LB strategy).'] },
    { id: 'journey', h: 'Retirement journey', src: 'Sodra (pension amounts, dates), State Data Agency (wages, CPI), laws (contribution rates, state incentive), fund unit values.', upd: 'Monthly or when laws change.',
      calc: 'The model accumulates contributions by the rates and the fund return; assumptions are listed at the bottom of the page.', lim: ['The future pension is a model, not a forecast; the Sodra pension depends on future decisions.'] },
  ],
  limits: 'General limitations', limitsL: ['Data is collected automatically from public sources – errors happen; implausible jumps (> 25 % a day) are rejected.', 'For information only, not investment advice.', 'The Excel files (“⤓” buttons next to tables) contain the raw data and real Excel formulas so every number can be recalculated.'],
} };
const SRC_OF = { nav: null, aum: null, p3: 'p3', pf: 'pf', rep: 'lbr', fee: 'fee2', idx: 'idx', estr: 'estr', cpi: 'cpi' };
function render() {
  const d = DOC[lang] || DOC.lt, $ = id => document.getElementById(id);
  $('h0').textContent = d.h0; $('lead').textContent = d.lead;
  $('toc').innerHTML = `<a href="#sources">${lang === 'lt' ? 'Duomenų šaltiniai ir atnaujinimas' : 'Data sources and updates'}</a>` + d.secs.map(s => `<a href="#${s.id}">${s.h}</a>`).join('') + `<a href="#limits">${d.limits}</a><a href="#glossary">${lang === 'lt' ? 'Žodynėlis' : 'Glossary'}</a>`;
  const lastOf = s => {
    if (typeof FRESH === 'undefined') return '';
    if (s.id === 'nav' || s.id === 'aum') return iso(FRESH.top);
    const x = (FRESH.src || []).find(v => v.k === SRC_OF[s.id]); return x ? (x.k === 'cpi' ? iso(x.d).slice(0, 7) : iso(x.d)) : '';
  };
  $('secs').innerHTML = d.secs.map(s => { const l = lastOf(s); return `<section class="card" id="${s.id}"><h2>${s.h}</h2><dl><dt>${d.src}</dt><dd>${s.src}</dd><dt>${d.upd}</dt><dd>${s.upd}</dd>${l ? `<dt>${d.last}</dt><dd>${l}</dd>` : ''}<dt>${d.calc}</dt><dd>${s.calc}</dd><dt>${d.lim}</dt><dd><ul>${s.lim.map(x => `<li>${x}</li>`).join('')}</ul></dd></dl></section>`; }).join('')
    + `<section class="card" id="limits"><h2>${d.limits}</h2><ul>${d.limitsL.map(x => `<li>${x}</li>`).join('')}</ul></section>`
    + `<section class="card" id="glossary"><h2>${lang === 'lt' ? 'Žodynėlis' : 'Glossary'}</h2><p class="note">${lang === 'lt' ? 'Tie patys paaiškinimai rodomi užvedus pelę (telefone – palietus) ant punktyru pabrauktų lentelių stulpelių pavadinimų.' : 'The same explanations appear when hovering over (on a phone – tapping) the dotted-underlined column names in tables.'}</p><dl>${GLOSS.map(g => glossText(g)).sort((a, b) => a[0].localeCompare(b[0], T().locale)).map(([h, x]) => `<dt>${h}</dt><dd>${x}</dd>`).join('')}</dl></section>`;
  renderInv();
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
}
/* Visų duomenų šaltinių sąrašas ir rankinio atnaujinimo tvarkaraštis (data_src.js, sudaro build_site.py iš sources_list.py) */
function renderInv() {
  const el = document.getElementById('srcInv'); if (!el || typeof SRCINV === 'undefined') return;
  const lt = lang === 'lt', t = T(), now = Math.floor(Date.now() / DAY);
  const fd = (x, f) => x == null ? '–' : f === 'y' ? iso(x).slice(0, 4) : f === 'm' ? iso(x).slice(0, 7) : iso(x);
  const pg = ps => ps.map(p => `<a href="${p}.html">${t[navKey(p)] || p}</a>`).join(', ');
  const src = s => s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${lt ? s.src_lt : s.src_en}</a>` : (lt ? s.src_lt : s.src_en);
  const mode = s => s.mode === 'auto' ? `<span class="ok">${lt ? 'Automatiškai' : 'Automatic'}</span>` : `<span class="man">${lt ? 'Rankiniu būdu' : 'Manual'}</span>`;
  const due = s => s.next == null ? '–' : s.mode === 'manual' && now > s.next ? `<b class="late">${iso(s.next)} ⚠</b>` : iso(s.next);
  const rows = SRCINV.map(s => `<tr><td class="l">${lt ? s.lt : s.en}</td><td class="l">${src(s)}</td><td class="l">${pg(s.pages)}</td><td class="l">${mode(s)}<br><small>${lt ? s.f_lt : s.f_en}</small></td><td>${fd(s.last, s.fmt)}</td><td>${due(s)}</td></tr>`).join('');
  const man = SRCINV.filter(s => s.mode === 'manual').sort((a, b) => (a.next ?? 1e9) - (b.next ?? 1e9));
  const mrows = man.map(s => `<tr${s.next != null && now > s.next ? ' class="lt"' : ''}><td>${s.next == null ? (lt ? 'pagal poreikį' : 'as needed') : iso(s.next)}${s.next != null && now > s.next ? ' ⚠' : ''}</td><td class="l">${lt ? s.lt : s.en}</td><td class="l">${lt ? s.how_lt : s.how_en}</td></tr>`).join('');
  const nA = SRCINV.filter(s => s.mode === 'auto').length;
  el.innerHTML = `<section class="card" id="sources"><h2>${lt ? 'Duomenų šaltiniai ir atnaujinimas' : 'Data sources and updates'}</h2>`
    + `<p class="note">${lt ? `Visi svetainės duomenų šaltiniai: ${nA} iš ${SRCINV.length} atnaujinami automatiškai, kiti – rankiniu būdu pagal tvarkaraštį žemiau. Datos skaičiuojamos iš pačių duomenų kiekvieną kartą atnaujinant svetainę.` : `All data sources of the site: ${nA} of ${SRCINV.length} are updated automatically, the rest manually on the schedule below. Dates are computed from the data itself at every site update.`}</p>`
    + `<div class="scroll"><table class="inv"><thead><tr><th class="l">${lt ? 'Duomenys' : 'Data'}</th><th class="l">${lt ? 'Šaltinis' : 'Source'}</th><th class="l">${lt ? 'Puslapiai' : 'Pages'}</th><th class="l">${lt ? 'Kaip atnaujinama' : 'How updated'}</th><th>${lt ? 'Paskutiniai duomenys' : 'Latest data'}</th><th>${lt ? 'Laukiama naujų' : 'Next expected'}</th></tr></thead><tbody>${rows}</tbody></table></div>`
    + `<h3 id="reliability">${lt ? 'Kas nutinka, jei šaltinis neveikia' : 'What happens if a source fails'}</h3>`
    + `<p class="note">${lt ? 'Svetainė niekada tyliai nerodo klaidingų skaičių: jei duomenų negaunama, rodoma paskutinė gauta data ir pranešimas viršuje paaiškina priežastį, įtaką ir ką daryti.' : 'The site never silently shows wrong numbers: if data stop arriving, the last date received is shown and a notice at the top explains the cause, the impact and what to do.'}</p>`
    + `<div class="scroll"><table class="inv"><thead><tr><th class="l">${lt ? 'Duomenys' : 'Data'}</th><th class="l">${lt ? 'Atsarginis planas' : 'Backup'}</th><th class="l">${lt ? 'Jei neveikia nė vienas' : 'If nothing works'}</th></tr></thead><tbody>`
    + SRCINV.filter(s => s.bk_lt).map(s => `<tr><td class="l">${lt ? s.lt : s.en}</td><td class="l">${lt ? s.bk_lt : s.bk_en}</td><td class="l">${lt ? s.fl_lt : s.fl_en}</td></tr>`).join('') + '</tbody></table></div>'
    + `<h3 id="schedule">${lt ? 'Rankinio atnaujinimo tvarkaraštis' : 'Manual update schedule'}</h3>`
    + `<div class="scroll"><table class="inv"><thead><tr><th>${lt ? 'Iki' : 'By'}</th><th class="l">${lt ? 'Ką atnaujinti' : 'What'}</th><th class="l">${lt ? 'Kaip' : 'How'}</th></tr></thead><tbody>${mrows}</tbody></table></div>`
    + `<p class="note">${lt ? '⚠ – laikas atnaujinti. Pavėlavę darbai taip pat nurodomi vakariniame laiške.' : '⚠ – due. Overdue items are also listed in the evening e-mail.'}</p></section>`;
}
renderHeader('apie', render);
render();
addEventListener('load', () => setTimeout(render, 300));   // FRESH įkeliamas atskirai – datos atsiranda po įkėlimo
</script>
</body>
