<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Pensijų fondų sekimas</title>
<link rel="stylesheet" href="style.css?v=a997ec9e">
<style>
  .doc { display: grid; gap: 14px; max-width: 980px; }
  .toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
  .doc section { scroll-margin-top: 90px; }
  .doc h2 { margin-bottom: 8px; }
  .doc dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 0; font-size: 14px; line-height: 1.5; }
  .doc dt { color: var(--text-3); }
  .doc dd { margin: 0; }
  .doc ul { margin: 0; padding-left: 18px; }
  .doc code { font-size: 13px; background: var(--hover); padding: 1px 4px; border-radius: 4px; }
  .inv { width: 100%; border-collapse: collapse; font-size: 13px; }
  .inv th, .inv td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; white-space: nowrap; }
  .inv th.l, .inv td.l { text-align: left; white-space: normal; }
  .inv .ok { color: var(--dpos); } .inv .man { color: var(--text-2); font-weight: 600; } .inv .late, .inv tr.lt td { color: var(--dneg); }
  #sources h3 { margin: 16px 0 6px; font-size: 15px; }
  @media (max-width: 600px) { .doc dl { grid-template-columns: 1fr; gap: 2px; } .doc dd { margin-bottom: 8px; } }
</style>
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <main class="doc">
    <section class="card"><h2 id="h0"></h2><p id="lead"></p><nav class="toc" id="toc"></nav></section>
    <div id="srcInv" style="margin:14px 0"></div>
    <div class="doc" id="secs"></div>
  </main>
  <footer id="foot"></footer>
</div>
<script src="common.js?v=aedddf28"></script>
<script src="data_src.js?v=54bec921"></script>
<script src="methodology.js?v=00fec0fe"></script>
<script>
/* „Apie ir metodika“ (auditas #53, #57): iš kur kiekvienas duomuo, kaip dažnai atnaujinama, formulės, prielaidos, žinomi apribojimai.
   Skyrių id naudojami nuorodose „Metodika →“ po lentelėmis (common.js srcLines). Be nuorodų į kodą. */
/* DOC – methodology.js */
const SRC_OF = { nav: null, aum: null, p3: 'p3', pf: 'pf', rep: 'lbr', fee: 'fee2', idx: 'idx', estr: 'estr', cpi: 'cpi' };
function render() {
  const d = DOC[lang] || DOC.lt, $ = id => document.getElementById(id);
  $('h0').textContent = d.h0; $('lead').textContent = d.lead;
  $('toc').innerHTML = `<a href="#sources">${lang === 'lt' ? 'Duomenų šaltiniai ir atnaujinimas' : 'Data sources and updates'}</a>` + d.secs.map(s => `<a href="#${s.id}">${s.h}</a>`).join('') + `<a href="#limits">${d.limits}</a><a href="#glossary">${lang === 'lt' ? 'Žodynėlis' : 'Glossary'}</a>`;
  const lastOf = s => {
    if (typeof FRESH === 'undefined') return '';
    if (s.id === 'nav' || s.id === 'aum') return iso(FRESH.top);
    const x = (FRESH.src || []).find(v => v.k === SRC_OF[s.id]); return x ? (x.k === 'cpi' ? iso(x.d).slice(0, 7) : iso(x.d)) : '';
  };
  $('secs').innerHTML = d.secs.map(s => { const l = lastOf(s); return `<section class="card" id="${s.id}"><h2>${s.h}</h2><dl><dt>${d.src}</dt><dd>${s.src}</dd><dt>${d.upd}</dt><dd>${s.upd}</dd>${l ? `<dt>${d.last}</dt><dd>${l}</dd>` : ''}<dt>${d.calc}</dt><dd>${s.calc}</dd><dt>${d.lim}</dt><dd><ul>${s.lim.map(x => `<li>${x}</li>`).join('')}</ul></dd></dl></section>`; }).join('')
    + `<section class="card" id="limits"><h2>${d.limits}</h2><ul>${d.limitsL.map(x => `<li>${x}</li>`).join('')}</ul></section>`
    + `<section class="card" id="glossary"><h2>${lang === 'lt' ? 'Žodynėlis' : 'Glossary'}</h2><p class="note">${lang === 'lt' ? 'Tie patys paaiškinimai rodomi užvedus pelę (telefone – palietus) ant punktyru pabrauktų lentelių stulpelių pavadinimų.' : 'The same explanations appear when hovering over (on a phone – tapping) the dotted-underlined column names in tables.'}</p><dl>${GLOSS.map(g => glossText(g)).sort((a, b) => a[0].localeCompare(b[0], T().locale)).map(([h, x]) => `<dt>${h}</dt><dd>${x}</dd>`).join('')}</dl></section>`;
  renderInv();
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
}
/* Visų duomenų šaltinių sąrašas ir rankinio atnaujinimo tvarkaraštis (data_src.js, sudaro build_site.py iš sources_list.py) */
function renderInv() {
  const el = document.getElementById('srcInv'); if (!el || typeof SRCINV === 'undefined') return;
  const lt = lang === 'lt', t = T(), now = Math.floor(Date.now() / DAY);
  const fd = (x, f) => x == null ? '–' : f === 'y' ? iso(x).slice(0, 4) : f === 'm' ? iso(x).slice(0, 7) : iso(x);
  const pg = ps => ps.map(p => `<a href="${p}.html">${t[navKey(p)] || p}</a>`).join(', ');
  const src = s => s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${lt ? s.src_lt : s.src_en}</a>` : (lt ? s.src_lt : s.src_en);
  const mode = s => s.mode === 'auto' ? `<span class="ok">${lt ? 'Automatiškai' : 'Automatic'}</span>` : `<span class="man">${lt ? 'Rankiniu būdu' : 'Manual'}</span>`;
  const due = s => s.next == null ? '–' : s.mode === 'manual' && now > s.next ? `<b class="late">${iso(s.next)} ⚠</b>` : iso(s.next);
  const rows = SRCINV.map(s => `<tr><td class="l">${lt ? s.lt : s.en}</td><td class="l">${src(s)}</td><td class="l">${pg(s.pages)}</td><td class="l">${mode(s)}<br><small>${lt ? s.f_lt : s.f_en}</small></td><td>${fd(s.last, s.fmt)}</td><td>${due(s)}</td></tr>`).join('');
  const man = SRCINV.filter(s => s.mode === 'manual').sort((a, b) => (a.next ?? 1e9) - (b.next ?? 1e9));
  const mrows = man.map(s => `<tr${s.next != null && now > s.next ? ' class="lt"' : ''}><td>${s.next == null ? (lt ? 'pagal poreikį' : 'as needed') : iso(s.next)}${s.next != null && now > s.next ? ' ⚠' : ''}</td><td class="l">${lt ? s.lt : s.en}</td><td class="l">${lt ? s.how_lt : s.how_en}</td></tr>`).join('');
  const nA = SRCINV.filter(s => s.mode === 'auto').length;
  el.innerHTML = `<section class="card" id="sources"><h2>${lt ? 'Duomenų šaltiniai ir atnaujinimas' : 'Data sources and updates'}</h2>`
    + `<p class="note">${lt ? `Visi svetainės duomenų šaltiniai: ${nA} iš ${SRCINV.length} atnaujinami automatiškai, kiti – rankiniu būdu pagal tvarkaraštį žemiau. Datos skaičiuojamos iš pačių duomenų kiekvieną kartą atnaujinant svetainę.` : `All data sources of the site: ${nA} of ${SRCINV.length} are updated automatically, the rest manually on the schedule below. Dates are computed from the data itself at every site update.`}</p>`
    + `<div class="scroll"><table class="inv"><thead><tr><th class="l">${lt ? 'Duomenys' : 'Data'}</th><th class="l">${lt ? 'Šaltinis' : 'Source'}</th><th class="l">${lt ? 'Puslapiai' : 'Pages'}</th><th class="l">${lt ? 'Kaip atnaujinama' : 'How updated'}</th><th>${lt ? 'Paskutiniai duomenys' : 'Latest data'}</th><th>${lt ? 'Laukiama naujų' : 'Next expected'}</th></tr></thead><tbody>${rows}</tbody></table></div>`
    + `<details class="owner"><summary>${lt ? 'Duomenų patikimumas ir priežiūra (svetainės savininkui)' : 'Reliability and maintenance (for the site owner)'}</summary>`
    + `<h3 id="reliability">${lt ? 'Kas nutinka, jei šaltinis neveikia' : 'What happens if a source fails'}</h3>`
    + `<p class="note">${lt ? 'Svetainė niekada tyliai nerodo klaidingų skaičių: jei duomenų negaunama, rodoma paskutinė gauta data ir pranešimas viršuje paaiškina priežastį, įtaką ir ką daryti.' : 'The site never silently shows wrong numbers: if data stop arriving, the last date received is shown and a notice at the top explains the cause, the impact and what to do.'}</p>`
    + `<div class="scroll"><table class="inv"><thead><tr><th class="l">${lt ? 'Duomenys' : 'Data'}</th><th class="l">${lt ? 'Atsarginis planas' : 'Backup'}</th><th class="l">${lt ? 'Jei neveikia nė vienas' : 'If nothing works'}</th></tr></thead><tbody>`
    + SRCINV.filter(s => s.bk_lt).map(s => `<tr><td class="l">${lt ? s.lt : s.en}</td><td class="l">${lt ? s.bk_lt : s.bk_en}</td><td class="l">${lt ? s.fl_lt : s.fl_en}</td></tr>`).join('') + '</tbody></table></div>'
    + `<h3 id="schedule">${lt ? 'Rankinio atnaujinimo tvarkaraštis' : 'Manual update schedule'}</h3>`
    + `<div class="scroll"><table class="inv"><thead><tr><th>${lt ? 'Iki' : 'By'}</th><th class="l">${lt ? 'Ką atnaujinti' : 'What'}</th><th class="l">${lt ? 'Kaip' : 'How'}</th></tr></thead><tbody>${mrows}</tbody></table></div>`
    + `<p class="note">${lt ? '⚠ – laikas atnaujinti. Pavėlavę darbai taip pat nurodomi vakariniame laiške.' : '⚠ – due. Overdue items are also listed in the evening e-mail.'}</p></details></section>`;
}
renderHeader('apie', render);
render();
addEventListener('load', () => setTimeout(render, 300));   // FRESH įkeliamas atskirai – datos atsiranda po įkėlimo
</script>
</body>
</html>
