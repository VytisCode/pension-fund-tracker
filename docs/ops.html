<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Duomenų kalendorius</title>
<link rel="stylesheet" href="style.css?v=8ce07a81">
<style>
  .ops { display: grid; gap: 14px; }
  .ops h2 { margin: 0 0 8px; }
  .ops .note { color: var(--text-3); font-size: 12.5px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpis .k { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpis .k .l { color: var(--text-3); font-size: 12.5px; } .kpis .k .v { font-size: 22px; font-weight: 700; margin-top: 4px; } .kpis .k .s { color: var(--text-2); font-size: 12.5px; margin-top: 2px; }
  @media (max-width: 800px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .calhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .calhead b { font-size: 16px; min-width: 150px; text-align: center; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .dw { font-size: 12px; color: var(--text-3); text-align: center; padding: 2px 0; }
  .cal .d { min-height: 86px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 5px; background: var(--card); cursor: pointer; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 2px; }
  .cal .d.out { opacity: .35; } .cal .d.we { background: var(--surface); }
  .cal .d.today { outline: 2px solid var(--accent); outline-offset: -1px; }
  .cal .d.sel { box-shadow: inset 0 0 0 2px var(--text-2); }
  .cal .d .n { font-size: 12px; color: var(--text-3); }
  .cal .chip { font-size: 11px; line-height: 1.3; border-radius: 4px; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.new { background: color-mix(in srgb, var(--dpos) 16%, transparent); color: var(--text); }
  .chip.fail { background: color-mix(in srgb, var(--dneg) 20%, transparent); color: var(--text); font-weight: 600; }
  .chip.ok { background: color-mix(in srgb, var(--dpos) 8%, transparent); color: var(--text-2); }
  .chip.due { border: 1px dashed var(--axis); color: var(--text-2); }
  .chip.man { border: 1px dashed var(--warn); color: var(--warn); font-weight: 600; }
  @media (max-width: 700px) { .cal .d { min-height: 54px; } .cal .chip { font-size: 9.5px; } }
  .lgd { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-2); margin-top: 8px; }
  .lgd .lgw { position: relative; display: inline-flex; }
  .lgd .lgb { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; color: var(--text-2); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .lgd .lgb:hover { background: var(--hover); } .lgd .lgb.on { border-color: var(--accent); color: var(--text); font-weight: 600; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
  .lgd .lgb small { color: var(--text-3); font-weight: 500; } .lgd .lgb.clr { color: var(--accent); }
  .lgd .lgb .chip { padding: 0 6px; }
  .lgd .lgpop { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.16); padding: 10px 12px; font-size: 12.5px; color: var(--text); }
  .lgd .lgw:hover .lgpop, .lgd .lgw:focus-within .lgpop { display: block; }
  .lgd .lgpop b { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin-bottom: 6px; }
  .lgd .lgi { display: grid; grid-template-columns: 112px 1fr; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); }
  .lgd .lgi .t { font-variant-numeric: tabular-nums; color: var(--text-2); } .lgd .lgi.late .t { color: var(--warn); font-weight: 600; }
  .lgd .lgi small { display: block; color: var(--text-3); margin-top: 1px; }
  .ot { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ot th, .ot td { padding: 5px 7px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .ot td.n, .ot th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ot td.t { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ot tr.fail td { color: var(--dneg); } .ot tr.late td:first-child { color: var(--warn); font-weight: 600; }
  .ot .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--hover); color: var(--text-2); margin-left: 6px; }
  .ot .tag.man { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); font-weight: 600; }
  .hm td.c { text-align: center; font-variant-numeric: tabular-nums; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <main class="ops">
    <div class="kpis" id="kpis"></div>
    <section class="card"><h2 id="hCal"></h2><p class="note" id="nCal"></p>
      <div class="calhead"><button class="btn" type="button" id="prev" aria-label="Ankstesnis mėnuo">←</button><b id="mon"></b><button class="btn" type="button" id="next" aria-label="Kitas mėnuo">→</button><button class="btn" type="button" id="todayB"></button></div>
      <div class="lgd" id="lgd" style="margin:0 0 10px"></div><div class="cal" id="cal"></div></section>
    <section class="card" id="dayCard"><h2 id="hDay"></h2><div class="scroll"><table class="ot" id="tDay"></table></div></section>
    <section class="card"><h2 id="hArr"></h2><p class="note" id="nArr"></p><div class="scroll"><table class="ot hm" id="tArr"></table></div></section>
    <div class="two">
      <section class="card"><h2 id="hUp"></h2><p class="note" id="nUp"></p><div class="scroll"><table class="ot" id="tUp"></table></div></section>
      <section class="card"><h2 id="hFail"></h2><p class="note" id="nFail"></p><div class="scroll"><table class="ot" id="tFail"></table></div></section>
    </div>
  </main>
  <footer id="foot"></footer>
</div>
<script src="common.js?v=dbdab785"></script>
<script src="data_ops.js?v=b5fe4686"></script>
<script src="ops.js?v=5ac34269"></script>
</body>
</html>
