<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Kaip tai veikia</title>
<link rel="stylesheet" href="style.css?v=a06ea69d">
<style>
  .how { display: grid; gap: 16px; }
  .how .lead { max-width: 900px; color: var(--text-2); line-height: 1.55; margin: 0; }
  .hk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .hk .k { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .hk .k b { display: block; font-size: 24px; } .hk .k span { color: var(--text-2); font-size: 13px; }
  @media (max-width: 800px) { .hk { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .hbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .hbar .lbl { font-size: 13px; color: var(--text-3); }
  .chipb { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--text-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chipb:hover { background: var(--hover); }
  .chipb[aria-pressed="true"] { border-color: var(--accent); color: var(--text); font-weight: 600; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  /* srautų schema: 5 stulpeliai, jungtys – SVG po kortelėmis */
  .flow { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px 34px; padding: 6px 2px; }
  .flow svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .wires path { fill: none; stroke: var(--axis); stroke-width: 1.4; opacity: .45; transition: opacity .2s, stroke-width .2s; }
  .wires path.on { stroke: var(--accent); opacity: 1; stroke-width: 2.4; }
  .wires path.ai.on { stroke: var(--ai); }
  .flow.sel .wires path:not(.on) { opacity: .08; }
  .col { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }
  .col h3 { margin: 0 0 2px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-family: inherit; }
  .nd { text-align: left; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--kc); border-radius: 10px; padding: 8px 10px; cursor: pointer; transition: opacity .2s, box-shadow .2s, transform .2s; }
  .nd:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .nd b { display: block; font-size: 13.5px; line-height: 1.3; }
  .nd small { display: block; color: var(--text-3); font-size: 12px; margin-top: 2px; line-height: 1.35; }
  .nd .bd { float: right; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 999px; margin-left: 6px; color: var(--kc); background: color-mix(in srgb, var(--kc) 12%, transparent); }
  .flow.sel .nd:not(.on) { opacity: .28; }
  .nd.on { box-shadow: 0 0 0 2px color-mix(in srgb, var(--kc) 45%, transparent); }
  .nd.cur { transform: translateY(-1px); box-shadow: 0 0 0 3px var(--kc); }
  .k-ext { --kc: #7a6f64; } .k-code { --kc: var(--accent); } .k-ai { --kc: var(--ai); } .k-man { --kc: var(--warn); } .k-out { --kc: #3c6fb0; }
  :root { --ai: #8a4fd0; } :root[data-theme="dark"] { --ai: #b996ef; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ai: #b996ef; } }
  .det { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-height: 92px; }
  .det h3 { margin: 0 0 6px; font-size: 17px; } .det p { margin: 6px 0; line-height: 1.55; color: var(--text-2); }
  .det dl { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 13.5px; } .det dt { color: var(--text-3); } .det dd { margin: 0; }
  .det code { font-size: 12.5px; background: var(--hover); padding: 1px 4px; border-radius: 4px; }
  .det .hint { color: var(--text-3); }
  .story { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: color-mix(in srgb, var(--accent) 7%, var(--card)); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .story p { margin: 0; flex: 1 1 380px; line-height: 1.5; } .story .n { font-variant-numeric: tabular-nums; color: var(--text-3); font-size: 13px; }
  .tl { display: grid; grid-template-columns: 110px 1fr; gap: 0; font-size: 14px; }
  .tl > div { padding: 8px 10px; border-bottom: 1px solid var(--line); line-height: 1.45; } .tl .t { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .two ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.55; } .two h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  @media (max-width: 1000px) {
    .flow { grid-template-columns: 1fr; gap: 14px; } .flow svg.wires { display: none; }
    .col { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } .col h3 { grid-column: 1 / -1; }
    .two { grid-template-columns: 1fr; } .det dl { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <main class="how">
    <p class="lead" id="lead"></p>
    <div class="hk" id="kpis"></div>
    <section>
      <h2 class="sec" id="hFlow"></h2>
      <div class="story" id="story"></div>
      <div class="hbar" id="threads" style="margin:12px 0 6px"></div>
      <div class="hbar" id="kinds" style="margin-bottom:12px"></div>
      <div class="card"><div class="flow" id="flow"><svg class="wires" id="wires" aria-hidden="true"></svg></div></div>
      <div class="det" id="det" aria-live="polite" style="margin-top:12px"></div>
    </section>
    <section><h2 class="sec" id="hDay"></h2><div class="card"><div class="tl" id="tl"></div></div></section>
    <section><h2 class="sec" id="hAi"></h2><div class="two" id="ai"></div></section>
  </main>
  <footer id="foot"></footer>
</div>
<script src="common.js?v=389b6a4a"></script>
<script src="how.js?v=158bd71c"></script>
</body>
</html>
