<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Baltijos šalys</title>
<link rel="stylesheet" href="style.css?v=8ce07a81">
<style>
  .bx { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .bx > [data-tab] { min-width: 0; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .bx .seg { max-width: 100%; overflow-x: auto; }
  .bx .card { min-width: 0; }
  .bx h2 { margin-top: 0; }
  .bx > [data-tab] > h2.sec { margin: 0 0 -8px; }
  .bx > [data-tab] > .lead { margin: 0; color: var(--text-2); }
  .kp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .kp .card h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .kp .card p { margin: 4px 0; font-size: 13.5px; color: var(--text-2); }
  .kp .card b { color: var(--text); }
  .flag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px; background: var(--hover); color: var(--text-2); }
  @media (max-width: 900px) { .kp { grid-template-columns: 1fr; } }
  .flt { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .flt input[type="search"] { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; min-width: 200px; }
  .bt { width: 100%; border-collapse: collapse; font-size: 13px; }
  .bt th, .bt td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .bt th { cursor: pointer; user-select: none; font-weight: 600; color: var(--text-2); position: sticky; top: 0; background: var(--card); }
  .bt th[aria-sort="ascending"]::after { content: " ▲"; } .bt th[aria-sort="descending"]::after { content: " ▼"; }
  .bt td.n, .bt th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .bt td.nm { white-space: normal; min-width: 180px; }
  .bt td.neg { color: var(--dneg); } .bt td.pos { color: var(--dpos); }
  .bt tr.cmp td { background: var(--hover); }
  .bt input[type="checkbox"] { margin: 0; }
  .rg { display: inline-block; padding: 1px 6px; border-radius: 5px; font-size: 11.5px; }
  .rg.r1 { background: #d9eadf; color: #1d4a2d; } .rg.r2 { background: #e8efd2; color: #3d4a17; } .rg.r3 { background: #f4e5c8; color: #5a3d0c; } .rg.r4 { background: #f2d4c8; color: #6b2a14; }
  .sel { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .sel .chip b { font-weight: 600; }
  .sel .chip .x { margin-left: 2px; color: var(--text-3); }
  .note { font-size: 12.5px; color: var(--text-2); }
  .mt p, .mt li { font-size: 14px; line-height: 1.55; }
  .mt h3 { margin: 16px 0 6px; font-size: 15px; }
  .chart { min-height: 260px; }
  .rfc td { white-space: normal; vertical-align: top; min-width: 120px; } .rfc td.nm { min-width: 220px; }
  .hm td.n { min-width: 38px; padding: 4px 5px; color: var(--text); } .hm th[data-y] { cursor: pointer; }
  .hm td.nm { position: sticky; left: 0; background: var(--card); z-index: 1; min-width: 220px; } .hm th:first-child { position: sticky; left: 0; z-index: 2; }
  .hm tr.med td { font-weight: 600; border-top: 2px solid var(--line); } .hm tr.med td.nm { font-size: 12.5px; }
  .hmw { max-height: 70vh; overflow: auto; }
  @media (max-width: 700px) { .hm td.nm { min-width: 130px; max-width: 150px; font-size: 12px; } .hm td.nm small { display: none; } }
  .crt td.n { color: var(--text); } .crt th[data-s] { cursor: pointer; } .crt tr.gh td { font-weight: 600; padding-top: 14px; border-bottom: 2px solid var(--line); background: none; }
  .crt tr.med td { font-weight: 600; font-size: 12.5px; color: var(--text-2); } .crt td.nm small { margin-left: 4px; }
  @media (max-width: 700px) { .crt td.nm { min-width: 140px; font-size: 12px; } .crt td.nm small { display: none; } }
  .topg { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .ovg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 14px; } .ovg .card h3 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 8px; align-items: center; } .ovg #kp1 .card p { margin: 6px 0; font-size: 14px; color: var(--text-2); } .ovg #kp1 .card b { color: var(--text); }
  @media (max-width: 900px) { .ovg { grid-template-columns: 1fr; } }
  #mtD summary { cursor: pointer; font-weight: 600; font-size: 15px; } #mtD[open] summary { margin-bottom: 8px; }
  .shbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 6px 0 10px; } .shbar span { display: block; min-width: 2px; }
  .sel .chip i, .chip i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .crt tr.hl td { outline: 2px solid var(--accent); outline-offset: -2px; }
  #mgBr ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; } #mgBr h3 { margin: 0; font-size: 15px; }
  .jks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; } .jk p.note { margin: 2px 0; } .jk b { display: block; font-size: 26px; font-weight: 700; margin: 4px 0; font-variant-numeric: tabular-nums; } .jk b.pos { color: var(--dpos); } .jk b.neg { color: var(--dneg); }
  .topc h3 { margin: 0 0 2px; font-size: 14px; } .topc .bt td.nm { min-width: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <main class="bx">
    <div data-tab="ov">
      <h2 class="sec" id="ovT"></h2>
      <p class="lead" id="ovL"></p>
      <div class="ovg"><div id="kp1"></div>
        <section class="card"><h2 id="eeT"></h2><div class="seg" id="eeSeg" role="group"></div><div class="chart" id="eeCh"></div><p class="note" id="eeN"></p></section></div>
      <section class="card"><h2 id="ldT"></h2><p class="note" id="ldN"></p><div class="seg" id="ldSeg" role="group"></div><div class="scroll" style="margin-top:10px"><table class="bt" id="ldTbl"></table></div></section>
    </div>
    <div data-tab="cr">
      <h2 class="sec" id="crT"></h2>
      <p class="lead" id="crL"></p>
      <div class="bar flt" id="crBar"></div>
      <section class="card"><div class="scroll"><table class="bt crt" id="crTbl"></table></div><p class="note" id="crN"></p></section>
    </div>
    <div data-tab="rs">
      <h2 class="sec" id="rsT"></h2>
      <p class="lead" id="rsL"></p>
      <div class="bar flt" id="rsBar" hidden></div>
      <section class="card"><div class="scroll"><table class="bt crt" id="rsTbl"></table></div><p class="note" id="rsN"></p></section>
    </div>
    <div data-tab="mg">
      <h2 class="sec" id="mgT"></h2>
      <p class="lead" id="mgL"></p>
      <section class="card"><div class="seg" id="mgSeg" role="group"></div><div class="scroll" style="margin-top:10px"><table class="bt" id="mgTbl"></table></div><p class="note" id="mgN"></p></section>
      <section class="card"><h2 id="mgShT"></h2><div id="mgSh"></div></section>
      <h2 class="sec" id="mgBrT" style="margin-top:6px"></h2>
      <div class="topg" id="mgBr"></div>
    </div>
    <div data-tab="top">
      <h2 class="sec" id="topT"></h2>
      <p class="lead" id="topL"></p>
      <div class="topg" id="topG"></div>
    </div>
    <div data-tab="jr">
      <h2 class="sec" id="jrT"></h2>
      <p class="lead" id="jrL"></p>
      <div class="bar flt" id="jrBar"></div>
      <div id="jrBody" class="bx"></div>
    </div>
    <div data-tab="rk">
      <h2 class="sec" id="xT"></h2>
      <p class="lead" id="xL"></p>
      <div class="kp" id="kp"></div>
      <section class="card"><h2 id="rkT"></h2><p class="note" id="rkN"></p><div class="seg" id="rkSeg" role="group"></div><div class="scroll" style="margin-top:10px"><table class="bt" id="rkTbl"></table></div></section>
    </div>
    <div data-tab="hm">
      <h2 class="sec" id="hmT"></h2>
      <p class="lead" id="hmL"></p>
      <div class="bar flt" id="hmBar"></div>
      <section class="card"><div class="scroll hmw"><table class="bt hm" id="hmTbl"></table></div><p class="note" id="hmN"></p></section>
    </div>
    <div data-tab="cmp">
      <h2 class="sec" id="cmT"></h2>
      <p class="lead" id="cmL"></p>
      <div class="bar flt" id="cmBar"></div>
      <section class="card"><div class="sel" id="cmSel"></div><div class="chart" id="cmCh"></div><div class="scroll" style="margin-top:10px"><table class="bt" id="cmTbl"></table></div><p class="note" id="cmN"></p></section>
      <section class="card" id="cmTopS"><h2 id="cmTopT"></h2><p class="note" id="cmTopL"></p><div class="topg" id="cmTopG"></div></section>
    </div>
    <div data-tab="rf">
      <h2 class="sec" id="rfT"></h2>
      <p class="lead" id="rfL"></p>
      <section class="card"><p id="rfSay" style="font-size:15px;line-height:1.55;margin:0 0 10px"></p><div class="seg" id="rfSeg" role="group"></div><div class="chart" id="rfCh" style="margin-top:10px"></div></section>
      <section class="card"><h2 id="rfKT"></h2><div class="scroll"><table class="bt" id="rfK"></table></div><p class="note" id="rfN"></p></section>
      <section class="card"><h2 id="rfCT"></h2><div class="scroll"><table class="bt rfc" id="rfC"></table></div><p class="note" id="rfWhy"></p><p class="note" id="rfSrc"></p></section>
    </div>
    <details class="card mt" id="mtD"><summary id="mtT"></summary><div id="mtB"></div></details>
  </main>
  <footer id="foot"></footer>
</div>
<div id="actions"><button class="btn" type="button" id="xlBtn"></button></div>
<script src="data.js?v=11975f5b"></script>
<script src="common.js?v=dbdab785"></script>
<script src="data_baltic.js?v=027a2aa7"></script>
<script src="bxjr.js?v=d7f785b9"></script>
<script src="baltic.js?v=452ce2ce"></script>
</body>
</html>
