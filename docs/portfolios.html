<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Pension fund tracker</title>
<meta name="description" content="Lithuanian pension fund portfolios: holdings and quarterly changes">
<link rel="stylesheet" href="style.css?v=d83f4fb2">
<style>
  .pfbar { margin: 4px 0 12px; }
  table.pft { font-size: 13px; }
  table.pft th { cursor: pointer; user-select: none; white-space: normal; vertical-align: bottom; }
  table.pft td.nm { text-align: left; white-space: normal; min-width: 260px; }
  table.pft td.l, table.pft th.l { text-align: left; }
  table.pft td.nm small, .pfsub { color: var(--text-3); font-size: 11.5px; }
  table.pft tbody tr { cursor: pointer; }
  table.pft tbody tr:hover td { background: var(--hover); }
  table.pft tbody tr.sel td { background: var(--hover); box-shadow: inset 0 0 0 0 var(--accent); }
  table.pft tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  table.pft tr.exit td { color: var(--text-3); }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .b-new { background: #63be7b; color: #1a1a19; border-color: transparent; }
  .b-buy { background: #d6e382; color: #1a1a19; border-color: transparent; }
  .b-sell { background: #fbaa77; color: #1a1a19; border-color: transparent; }
  .b-exit { background: #f8696b; color: #1a1a19; border-color: transparent; }
  .up { color: var(--s5); font-weight: 600; } .down { color: #d0453f; font-weight: 600; }
  .pfgrid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .pfgrid { grid-template-columns: 1fr; } }
  .pfside { position: sticky; top: 10px; }
  @media (max-width: 1100px) { .pfside { position: static; } }
  .comp { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: 6px 0 6px; background: var(--grid); }
  .comp span { display: block; height: 100%; }
  .complg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); }
  .complg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 0 0 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .kpi b { display: block; font-size: 17px; margin-top: 2px; white-space: nowrap; }
  .kpi span { font-size: 12px; color: var(--text-2); }
  .more { margin-top: 10px; }
  table.altt td { text-align: center; }
  table.altt th { text-align: center; }
  table.altt td.l, table.altt th.l { text-align: left; }
  table.altt td:first-child { min-width: 190px; white-space: normal; }
  table.altt td.pfsub { white-space: normal; min-width: 180px; font-size: 11.5px; }
  table.altt tr.sep td { background: var(--surface); font-weight: 600; text-align: left; cursor: default; }
  .hist td { font-size: 12.5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 3px 4px; margin-top: 3px; }
  .tags span { font-size: 10.5px; line-height: 1.5; padding: 0 6px; border-radius: 999px; background: var(--grid); color: var(--text-2); white-space: nowrap; }
  #phMeta .tags { margin: 4px 0 2px; }
  h3.lk { font-size: 14px; margin: 16px 0 6px; }
  .lkk { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .kpi small { display: block; font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .pgsig { font-size: 13px; margin: 0 0 10px; }
  .pgsig ul { margin: 4px 0 0; padding-left: 18px; }
  .pgsig li { margin: 2px 0; }
  table.pgt td:first-child { min-width: 130px; }
  table.pgt tbody tr { cursor: pointer; }
  .lkreg span { cursor: pointer; border-radius: 6px; padding: 1px 4px; } .lkreg span:hover, .lkreg span.on { background: var(--hover); outline: 1px solid var(--line); }
  .pfbar .field { max-width: 100%; } .pfbar select { max-width: 100%; }
  @media (max-width: 700px) { .kpis, .lkk { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  h2.sec { margin: 26px 0 4px; font-size: 19px; }
  p.lead { color: var(--text-2); font-size: 13.5px; margin: 0 0 12px; max-width: 900px; }
</style>
</head>
<body>
<div class="wrap">
  <header id="top"></header>

  <h2 class="sec" id="tcTitle"></h2>
  <p class="lead" id="tcLead"></p>
  <div class="bar pfbar" id="tcBar"></div>
  <section class="card"><div class="scroll"><table class="pft" id="tcTable"></table></div>
    <button type="button" class="btn more" id="tcMore"></button>
    <p class="note" id="tcNote"></p></section>

  <h2 class="sec" id="altTitle"></h2>
  <p class="lead" id="altLead"></p>
  <div class="bar pfbar" id="altBar"></div>
  <section class="card"><div class="meta" id="altChartMeta"></div><div class="chart" id="altChart"></div><div class="legend" id="altLegend" style="margin-top:6px"></div></section>
  <section class="card" style="margin-top:12px"><div class="scroll"><table class="pft altt" id="altTable"></table></div><p class="note" id="altNote"></p></section>

  <h2 class="sec" id="pgTitle"></h2>
  <p class="lead" id="pgLead"></p>
  <div class="bar pfbar" id="pgBar"></div>
  <section class="card"><div class="scroll"><table class="pft altt pgt" id="pgTable"></table></div><p class="note" id="pgNote"></p></section>

  <h2 class="sec" id="fcTitle"></h2>
  <p class="lead" id="fcLead"></p>
  <div class="bar pfbar" id="fcBar"></div>
  <div class="pfgrid">
    <section class="card">
      <div class="kpis" id="fcKpis"></div>
      <div id="fcComp"></div>
      <div id="fcLook"></div>
      <div class="scroll" style="margin-top:12px"><table class="pft" id="fcTable"></table></div>
      <button type="button" class="btn more" id="fcMore"></button>
      <p class="note" id="fcNote"></p>
    </section>
    <aside class="card pfside" id="fcSide">
      <h2 id="phTitle"></h2>
      <div class="meta" id="phMeta"></div>
      <div class="chart" id="phChart"></div>
      <p class="note" id="phNote"></p>
      <div class="scroll"><table class="hist" id="phTable"></table></div>
    </aside>
  </div>
  <footer id="foot"></footer>
</div>
<script src="common.js?v=52cfea08"></script>
<script src="data_pf.js?v=9deb0173"></script>
<script src="pf.js?v=fe154e4d"></script>
</body>
</html>
